<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Aide-mémoire du chef d'équipe sous doctrine DOREX (JDR Alien)">
<title>DOREX — Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050805'/%3E%3Crect x='5' y='5' width='54' height='54' fill='none' stroke='%2339ff88' stroke-width='4'/%3E%3Cpath d='M18 16h14c9 0 14 6 14 16s-5 16-14 16H18z' fill='none' stroke='%2339ff88' stroke-width='5'/%3E%3C/svg%3E">
<style>
/* ===================== THÈME ===================== */
:root {
  --bg: #040704;
  --bg2: #0a120b;
  --bg3: #102014;
  --fg: #39ff88;        /* texte principal (phosphore vert) */
  --fg-dim: #22b561;    /* texte secondaire */
  --fg-faint: #16713d;  /* bordures */
  --amber: #ffb000;
  --orange: #ff8a1f;
  --red: #ff4b3e;
  --alert: var(--fg);   /* couleur d'alerte du niveau actif (réglée par JS) */
  --glow: 0 0 6px rgba(57,255,136,.35);
  --font: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "Roboto Mono", "Droid Sans Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
}
body.ambre {
  --fg: #ffc04a;
  --fg-dim: #d59a2c;
  --fg-faint: #7a5716;
  --bg2: #120e05;
  --bg3: #211808;
  --glow: 0 0 6px rgba(255,176,0,.35);
}
body[data-niv="0"], body[data-niv="1"] { --alert: var(--fg); }
body[data-niv="2"] { --alert: var(--amber); }
body[data-niv="3"] { --alert: var(--orange); }
body[data-niv="4"], body[data-niv="5"] { --alert: var(--red); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  text-shadow: var(--glow);
  min-height: 100vh; overflow-x: hidden;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body.scan::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--fg); }
small, .src { font-size: 12px; color: var(--fg-dim); }
.src { opacity: .9; overflow-wrap: anywhere; }
span.src { white-space: nowrap; }
@media (max-width: 360px) { span.src { white-space: normal; } }
h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 8px; color: var(--fg); border-bottom: 1px solid var(--fg-faint); padding-bottom: 4px; }
h3 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin: 16px 0 6px; color: var(--fg-dim); }
p { margin: 6px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 5px 0 5px 18px; position: relative; }
ul.plain li::before { content: "›"; position: absolute; left: 2px; color: var(--fg-dim); }
ul.interdits li::before { content: "✕"; color: var(--red); left: 0; }
ul.interdits li { padding-left: 20px; }

/* ===================== EN-TÊTE ===================== */
header#bandeau {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg); border-bottom: 2px solid var(--alert);
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
}
.b-top { display: flex; align-items: center; gap: 12px; }
.b-num {
  flex: 0 0 auto; min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--alert); color: var(--alert); font-size: 34px; font-weight: 700;
  text-shadow: 0 0 10px var(--alert);
}
body[data-niv="5"] .b-num { animation: clign 1.2s steps(2) infinite; }
@keyframes clign { 50% { background: var(--red); color: var(--bg); } }
@media (prefers-reduced-motion: reduce) { body[data-niv="5"] .b-num { animation: none; background: var(--red); color: var(--bg); } }
.b-txt { min-width: 0; }
.b-lab { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim); }
.b-nom { font-size: 18px; font-weight: 700; color: var(--alert); text-transform: uppercase; line-height: 1.2; }
.b-sub { font-size: 13px; color: var(--fg); margin-top: 2px; }
.b-sub b { color: var(--alert); font-weight: 600; }
#avert {
  display: none; margin-top: 8px; padding: 8px 10px; border: 2px solid var(--red); color: var(--red);
  background: rgba(255,75,62,.08); font-weight: 700; font-size: 14px; cursor: pointer;
}
#avert.on { display: block; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { background: rgba(255,75,62,.22); } }
@media (prefers-reduced-motion: reduce) { #avert.on { animation: none; } }

/* ===================== ONGLETS ===================== */
nav#onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--bg); border-top: 2px solid var(--fg-faint);
  padding-bottom: env(safe-area-inset-bottom);
}
nav#onglets button {
  position: relative; min-width: 0; background: none; border: 0; min-height: 64px; padding: 6px 1px; cursor: pointer;
  color: var(--fg-dim); font-size: 11px; letter-spacing: .03em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-top: 3px solid transparent;
}
nav#onglets button .ic { font-size: 20px; line-height: 1; }
nav#onglets button[aria-selected="true"] { color: var(--fg); border-top-color: var(--fg); background: var(--bg2); }
nav#onglets .pastille { position: absolute; top: 5px; left: calc(50% + 9px); color: var(--bg); background: var(--alert); border-radius: 8px; padding: 0 5px; font-size: 11px; line-height: 16px; text-shadow: none; }
/* 7 onglets sur téléphone (~360 px) : libellés resserrés pour que « Escouade » tienne */
@media (max-width: 420px) {
  nav#onglets button { font-size: 10px; letter-spacing: 0; }
  nav#onglets .pastille { left: auto; right: 1px; padding: 0 4px; }  /* reste dans l'onglet même à 2 chiffres */
}

main { max-width: 860px; margin: 0 auto; padding: 4px 14px 24px; }
section.tab { display: none; }
section.tab.on { display: block; }

/* ===================== BLOCS ===================== */
.carte { border: 1px solid var(--fg-faint); background: var(--bg2); padding: 10px 12px; margin: 10px 0; }
.carte.alert { border-color: var(--alert); }
.directive { font-size: 17px; font-weight: 700; color: var(--alert); }
.ligne { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.badge {
  display: inline-block; border: 1px solid currentColor; padding: 0 6px; font-size: 12px; font-weight: 700;
  letter-spacing: .05em; white-space: nowrap; text-shadow: none;
}
.b-n0, .b-n1 { color: var(--fg); }
.b-n2 { color: var(--amber); }
.b-n3 { color: var(--orange); }
.b-n4, .b-n5 { color: var(--red); }
.b-rel { color: var(--amber); }
.b-statut { color: var(--amber); }
.b-val { color: var(--red); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 8px 14px; cursor: pointer;
  background: var(--bg2); border: 2px solid var(--fg-dim); color: var(--fg);
  text-transform: uppercase; letter-spacing: .06em; font-size: 14px; text-shadow: var(--glow);
}
.btn:active { background: var(--bg3); }
.btn.pri { border-color: var(--alert); color: var(--alert); }
.btn.dang { border-color: var(--red); color: var(--red); }
.btn.plein { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.btns .btn { flex: 1 1 140px; }

/* Cases à cocher tactiles */
.chk {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 8px; min-height: 52px;
  border-bottom: 1px solid var(--fg-faint); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.chk:last-child { border-bottom: 0; }
.chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chk .box {
  flex: 0 0 auto; width: 28px; height: 28px; border: 2px solid var(--fg-dim); margin-top: 1px;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
}
.chk input:checked + .box { border-color: var(--alert); background: var(--alert); color: var(--bg); text-shadow: none; }
.chk input:checked + .box::after { content: "✓"; }
.chk input:focus-visible + .box { outline: 2px dashed var(--fg); outline-offset: 2px; }
.chk .corps { flex: 1 1 auto; min-width: 0; }
.chk.fait .lib { color: var(--fg-dim); text-decoration: line-through; text-decoration-color: var(--fg-faint); }
.chk .eff { font-size: 13px; color: var(--fg-dim); margin-top: 3px; }
.ev.actif { background: var(--bg3); }
.ev.actif .eff { color: var(--amber); }
.ev .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }

details { border: 1px solid var(--fg-faint); background: var(--bg2); margin: 10px 0; }
details > summary { cursor: pointer; padding: 12px; min-height: 48px; list-style: none; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; color: var(--fg-dim); }
details[open] > summary::before { content: "− "; }
details > .in { padding: 0 12px 12px; }
details.grp > summary { font-weight: 700; }
details.grp > .in { padding: 0 4px 4px; }

.resume { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.resume > div { border: 1px solid var(--fg-faint); padding: 8px; background: var(--bg2); text-align: center; }
.resume .big { font-size: 28px; font-weight: 700; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border: 1px solid var(--fg-faint); padding: 6px; text-align: left; vertical-align: top; }
th { color: var(--fg-dim); font-weight: 600; }
.tab-scroll { overflow-x: auto; }

/* Zones */
.zone { border: 1px solid var(--fg-faint); background: var(--bg2); padding: 10px; margin: 10px 0; }
.zone .zt { display: flex; gap: 8px; align-items: center; }
.zone .zt input { flex: 1 1 auto; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.seg button { min-height: 48px; background: var(--bg); border: 2px solid var(--fg-faint); color: var(--fg-dim); cursor: pointer; font-weight: 700; }
.seg button.on { background: var(--zc, var(--fg)); color: var(--bg); border-color: var(--zc, var(--fg)); text-shadow: none; }
.zc0 { --zc: var(--fg); } .zc1 { --zc: var(--amber); } .zc2 { --zc: var(--orange); } .zc3, .zc4 { --zc: var(--red); }
.zinfo { font-size: 13px; color: var(--fg-dim); margin-top: 8px; }
input[type=text], input[type=number], textarea, select {
  background: var(--bg); border: 2px solid var(--fg-faint); padding: 10px; min-height: 48px; width: 100%; color: var(--fg);
  border-radius: 0;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { outline: none; border-color: var(--fg); }
.ico { min-width: 48px; padding: 8px; }

/* Journal */
.jl { border-bottom: 1px solid var(--fg-faint); padding: 8px 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.jl .h { color: var(--fg-dim); font-size: 13px; white-space: nowrap; }
.jl .ty { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); }
.jl.niv .tx { color: var(--alert); font-weight: 700; }
.jl.refus .tx { color: var(--red); font-weight: 700; }
.jl .tx { grid-column: 1 / -1; word-wrap: break-word; }
.jl .ent { display: flex; gap: 10px; align-items: baseline; }
.seg.s4 { grid-template-columns: repeat(4, 1fr); }
.seg.s4 button { font-size: 13px; min-width: 0; padding: 4px 2px; }

/* Escouade — couleur de l'état de santé (--sante), par thème */
.s-excellent { --sante: var(--fg); }
.s-bon { --sante: #a6e85a; }
.s-moyen { --sante: var(--amber); }
.s-mauvais { --sante: var(--orange); }
.s-critique { --sante: var(--red); }
.s-decede { --sante: #7c7c7c; }
body.ambre .s-excellent { --sante: #fff0c4; }
body.ambre .s-bon { --sante: var(--fg); }
body.ambre .s-moyen { --sante: #ff9d2a; }
body.ambre .s-mauvais { --sante: #ff6d2a; }
details.marine { border-left: 4px solid var(--sante); }
/* Résumé replié sur une ligne : nom (+ pseudo), état de santé, petit cardiogramme */
details.marine > summary { display: flex; align-items: center; gap: 4px 10px; text-transform: none; letter-spacing: 0; font-size: 15px; }
.m-id { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.m-nom { color: var(--sante); font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.m-ps { font-size: 13px; color: var(--fg-dim); overflow-wrap: anywhere; min-width: 0; }
.m-sb { flex: 0 0 auto; color: var(--sante); font-size: 13px; font-weight: 700; }
.m-alerte { flex: 0 0 auto; align-self: flex-start; color: var(--red); font-size: 18px; line-height: 1; }
details.marine[open] .m-alerte { display: none; }
.m-lab { display: block; margin: 12px 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); }
.m-champs { display: grid; grid-template-columns: 1fr; gap: 0 10px; }
@media (min-width: 520px) { .m-champs { grid-template-columns: 1fr 1fr; } }
.seg.s3 { grid-template-columns: repeat(3, 1fr); }
.seg.sante { margin-top: 0; }
.seg.sante button { --zc: var(--sante); color: var(--sante); font-size: 14px; min-width: 0; padding: 4px 2px; }
.seg.sante button.on { color: var(--bg); }
.m-stress { display: flex; align-items: center; gap: 8px; }
.m-stress .val { min-width: 2.2em; text-align: center; font-size: 22px; font-weight: 700; }
.jauge { display: flex; gap: 2px; flex: 1 1 auto; min-width: 60px; }
.jauge i { flex: 1 1 0; height: 14px; border: 1px solid var(--fg-faint); }
.jauge i.on { background: var(--amber); border-color: var(--amber); }
.jauge i.on.h { background: var(--red); border-color: var(--red); }
/* Schéma du corps + cardiogramme */
/* Grille : schéma à gauche, cardiogramme à droite ; liste des blessures sous le cardiogramme,
   ou sur toute la largeur sous le schéma en écran étroit (sinon retour à la ligne à chaque mot). */
.m-corps { display: grid; grid-template-columns: 130px minmax(0, 1fr); grid-template-areas: "sil droite" "sil bl";
  grid-template-rows: auto 1fr; gap: 0 12px; align-items: start; margin-top: 12px; }
.m-sil { grid-area: sil; }
.m-sil svg { display: block; width: 130px; height: auto; overflow: visible; }
.m-droite { grid-area: droite; min-width: 0; }
.m-corps > .m-bl { grid-area: bl; min-width: 0; }
@media (max-width: 560px) { .m-corps { grid-template-areas: "sil droite" "bl bl"; grid-template-rows: auto auto; row-gap: 8px; } }
.bp { cursor: pointer; fill: var(--sante); fill-opacity: .25; stroke: var(--sante); stroke-width: 1.5; }
.bp:hover { fill-opacity: .45; }
.bp:focus { outline: none; }
.bp:focus-visible { stroke: var(--fg); stroke-width: 3; }
.bp.blesse { fill: url(#m-hachure); fill-opacity: 1; stroke: var(--red); stroke-width: 3; }
.s-decede .bp { stroke-dasharray: 3 2; }
.bp-l { fill: var(--fg-dim); font-size: 10px; pointer-events: none; text-shadow: none; }
.m-bpm { font-weight: 700; color: var(--sante); margin: 4px 0 6px; }
.m-bl { list-style: none; margin: 0; padding: 0; }
.m-bl button { display: flex; gap: 8px; width: 100%; min-height: 44px; padding: 6px 4px; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--fg-faint); font-size: 14px; }
.m-bl button b { flex: 0 0 auto; color: var(--fg-dim); font-weight: 600; }
.m-bl button span { min-width: 0; overflow-wrap: anywhere; color: var(--fg-dim); }
.m-bl button.blesse b, .m-bl button.blesse span { color: var(--red); }
.m-bl button.soigne b { color: var(--fg); }
.m-bl button span.bl-e { display: block; }
.m-bl button span.bl-s { color: var(--fg-dim); opacity: .7; text-decoration: line-through; }
.bp.soigne { fill: url(#m-soigne); fill-opacity: 1; stroke: var(--fg-dim); stroke-width: 2; stroke-dasharray: 4 2; }
/* Liste des blessures d'une partie (modale) */
.bl-liste { list-style: none; margin: 8px 0; padding: 0; }
.bl-it { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--fg-faint); color: var(--red); }
.bl-it .bl-h { flex: 0 0 auto; font-size: 13px; color: var(--fg-dim); white-space: nowrap; }
.bl-it .bl-tx { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.bl-it .bl-ctl { display: flex; gap: 4px; margin-left: auto; }
.bl-it .bl-ctl .btn { font-size: 13px; padding: 4px 8px; }
.bl-it .bl-ctl .btn.on { border-color: var(--fg); color: var(--fg); }
.bl-it.soignee .bl-tx { color: var(--fg-dim); opacity: .7; text-decoration: line-through; }
.bl-ajout { display: flex; gap: 6px; margin-top: 10px; }
.bl-ajout input { flex: 1 1 auto; min-width: 0; }
.ecg {
  position: relative; overflow: hidden; height: 60px; border: 1px solid var(--fg-faint); background-color: var(--bg);
  background-image: linear-gradient(color-mix(in srgb, var(--fg-faint) 30%, transparent) 1px, transparent 1px),
                    linear-gradient(90deg, color-mix(in srgb, var(--fg-faint) 30%, transparent) 1px, transparent 1px);
  background-size: 12px 12px;
}
.ecg::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, var(--bg), transparent 35%); }
.ecg.mini { flex: 0 0 96px; height: 30px; background-image: none; }
@media (max-width: 420px) { .ecg.mini { flex-basis: 60px; } }
details[open] > summary .ecg.mini { display: none; }
/* Défilement d'un motif de deux périodes identiques : une animation CSS composée par le navigateur
   (pas de boucle JS), une période = 50 % de la largeur du rail. */
.ecg-rail { width: 200%; height: 100%; animation: ecg linear infinite; will-change: transform; }
.ecg svg { display: block; width: 100%; height: 100%; }
.ecg path { fill: none; stroke: var(--sante); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ecg.mini path { stroke-width: 1.5; }
@keyframes ecg { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ecg-rail { animation: none; } }
.ecg-mort { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
  color: var(--red); font-weight: 700; letter-spacing: .25em; text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); }
.ecg.mini .ecg-mort { font-size: 10px; letter-spacing: .1em; }
/* Équipement */
.m-eq { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--fg-faint); }
.m-eq input[type=text] { flex: 1 1 160px; min-width: 0; }
.m-eq .ctl { display: flex; gap: 4px; align-items: center; margin-left: auto; }
.m-eq input[type=number] { width: 76px; text-align: center; padding: 8px 4px; }
.btn.pt { min-width: 44px; min-height: 44px; padding: 4px; }

/* Modale */
#modale { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(0,0,0,.82); padding: 14px; overflow-y: auto; }
#modale.on { display: flex; align-items: flex-start; justify-content: center; }
#modale .mb { width: 100%; max-width: 560px; margin-top: 6vh; background: var(--bg); border: 2px solid var(--mc, var(--alert)); padding: 14px; box-shadow: 0 0 24px rgba(0,0,0,.8); }
#modale h2 { margin-top: 0; color: var(--mc, var(--alert)); border-color: var(--mc, var(--alert)); }
.annonce { border-left: 3px solid var(--alert); padding: 6px 10px; margin: 10px 0; font-style: italic; }
.choix-niv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.choix-niv button { min-height: 56px; background: var(--bg2); border: 2px solid var(--fg-faint); cursor: pointer; }
.choix-niv button b { display: block; font-size: 22px; }

/* Onglet Règles */
.rg-q { display: flex; gap: 8px; }
.rg-q input { flex: 1 1 auto; min-width: 0; }
.rg-note { font-size: 13px; color: var(--fg-dim); }
details.rg > summary { font-weight: 700; }
details.sub { background: var(--bg); margin: 8px 0; }
details.sub > summary { font-size: 13px; padding: 10px; }
details summary .src { text-transform: none; letter-spacing: 0; font-weight: 400; }
#t-regles span.src { white-space: normal; }
#t-regles h3 { margin-top: 18px; }
h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 4px; color: var(--fg-dim); }
ol.num { margin: 0; padding-left: 26px; }
ol.num li { padding: 4px 0; }
ol.num li::marker { color: var(--fg-dim); }

  /* ---------- Onglet Règles ----------
     Contenu propre à l'onglet ; le reste (niveaux, événements, zones, ROE) est lu dans les
     données ci-dessus par les générateurs (champ gen) de rendreRegles().
     Format d'un bloc : { titre, src, intro, items, ordre, interdits, coches, cartes, note, gen }
     - item : "texte" ou ["texte", "source"] ; **gras** autorisé.
     - carte : { titre, lignes: [[libellé, texte]], texte, src }.
     Une section a des blocs et/ou des sous-sections repliables (sous: [{ titre, src, blocs }]). */
  regles: {
    sections: [
      { id: "principes", titre: "Principes importants", blocs: [
        { titre: "Principes généraux", src: "DOREX §1.2", items: [
          "La sécurité biologique prime sur toute mission.",
          "Toute entité inconnue est présumée hostile ou contaminante.",
          ["L'absence de réaction n'est pas une preuve d'innocuité ; l'immobilité n'est pas un indicateur de sécurité.", "DOREX §1.2, §6.2"],
          "Toute exposition est une contamination potentielle.",
          ["« Aucune réaction immédiate = absence de danger » est la cause majeure de mortalité différée.", "DOREX §4.4"],
          ["Tout changement après une exposition = contamination jusqu'à preuve du contraire.", "DOREX §10.1"],
          ["Toute structure peut être vivante, même immobile.", "DOREX §6.2"],
          ["**Ce qui n'est pas compris est dangereux. Ce qui est silencieux est surveillé. Ce qui est vivant est contenu.**", "DOREX A7"] ],
          note: ["73 % des incidents critiques commencent par une interaction non autorisée ; 61 % des contaminations viennent d'un non-respect de l'observation ; 88 % des pertes humaines suivent une rupture du confinement initial.", "DOREX §1.1"] },
        { titre: "Règles de décision", items: [
          ["**Doute → niveau supérieur.**", "EOD §1.7, §2.8, §3.8"],
          ["**Plusieurs déclencheurs actifs → le plus élevé s'applique.** On ne redescend jamais sous un niveau déjà imposé par un autre événement.", "✔ règle de table"],
          ["**Plusieurs catégories de menace → le risque le plus élevé s'applique.** Ex. : organisme + toxine → ORG ; spore + mutation inconnue → EXO.", "DOREX §2.2"],
          ["**Désaccord → la décision la plus restrictive s'applique.**", "DOREX §1.3"],
          ["En cas d'incertitude, l'exposition est considérée comme avérée jusqu'à vérification.", "EOD §3.1"],
          ["Zone classée plus dangereuse que ce que couvre le niveau actuel → le niveau DOREX monte au minimum imposé par la zone.", "✔ règle de table"],
          ["Chaque niveau hérite des interdits des niveaux inférieurs : aucun interdit n'est levé en montant.", "✔ règle de table"],
          ["Initiative individuelle interdite hors chaîne de commandement.", "EOD §1.5, §4.6"],
          ["Les documents DOREX sont des consignes et des recommandations qui ne tiennent pas compte de la réalité du terrain : sur place, l'ordre du commandement prime.", "✔ règle de table"] ] },
        { gen: "annonce" },
        { titre: "Hiérarchie de décision", src: "ROED §0.0", ordre: true, items: [
          "État biologique (DOREX)", "Doctrine d'engagement (ROE)", "Validation du commandement / IA de bord", "Exécution" ] },
        { titre: "Chaîne de commandement", src: "DOREX §1.3", ordre: true, items: [
          "Officier en charge de la mission — autorité tactique",
          "Officier scientifique — évaluation",
          "Commandement de la mission — validation stratégique",
          "IA de bord — support décisionnel" ],
          note: ["Seuls le commandement ou l'IA de bord autorisent la neutralisation lourde, le sacrifice de zone et la hausse du niveau ROE.", "EOD §5.3, §6.4, ROED §0.0"] },
        { titre: "Responsabilité individuelle", src: "DOREX §1.4", intro: "Tout membre d'équipage :", items: [
          "signale toute anomalie", "respecte les distances", "n'interagit jamais sans ordre explicite", "interrompt toute exposition suspectée" ],
          note: "**Le non-signalement équivaut à une faute critique.**" },
        { titre: "Priorités en intervention", src: "DOREX A5", ordre: true, items: [
          "Sécurité du bâtiment / vaisseau", "Confinement biologique", "Protection des équipes restantes", "Récupération du matériel", "Sauvetage individuel" ],
          note: ["**Survie collective** : la survie d'un individu n'a aucune priorité sur celle de l'installation ou de la population restante.", "DOREX §11.8, EOD §6.6"] }
      ] },

      { id: "definitions", titre: "Définitions", blocs: [
        { titre: "Documents de référence", cartes: [
          { titre: "DOREX", lignes: [["Nom", "Doctrine Opérationnelle de Réponse Exobiologique"], ["Rôle", "doctrine et procédures par situation"], ["Répond à", "« Que se passe-t-il ? Quelle procédure ? »"]] },
          { titre: "EOD", lignes: [["Nom", "Échelle Opérationnelle DOREX"], ["Rôle", "échelle 0 à 5, un chapitre par niveau ; fait référence pour les niveaux"], ["Répond à", "« À quel niveau sommes-nous, qu'impose-t-il ? »"]] },
          { titre: "ROED", lignes: [["Nom", "Règles d'engagement DOREX"], ["Rôle", "emploi de la force, niveaux 0 à 5"], ["Répond à", "« Quelle force est permise ? »"]] } ],
          note: "Références : « §3.1 » = paragraphe, « ch. 2 » = chapitre, « A1 à A7 » = annexes du DOREX." },
        { titre: "Classes de menace", src: "DOREX §2.1", cartes: [
          { titre: "BIO — Agent biologique", texte: "virus, spores, bactéries, toxines" },
          { titre: "ORG — Organisme vivant", texte: "faune, parasite, entité mobile" },
          { titre: "EXO — Origine inconnue", texte: "structure ou forme de vie non identifiée" },
          { titre: "ENV — Facteur environnemental", texte: "gaz, radiation, atmosphère hostile" },
          { titre: "IND — Phénomène anormal", texte: "manifestation non classifiable" } ],
          items: [
            ["Toute structure inconnue est classée **EXO jusqu'à preuve du contraire**.", "DOREX §6.1, EOD §1.4"],
            ["Une entité mobile est classée **ORG ou EXO mobile**.", "DOREX §8.1"],
            ["Plusieurs catégories → le risque le plus élevé s'applique.", "DOREX §2.2"] ] },
        { titre: "Statuts", cartes: [
          { titre: "CONTACT", lignes: [["Porte sur", "la situation"], ["Définition", "interaction, volontaire ou non, avec une entité au-delà de sa simple détection"]], src: "EOD §1.0" },
          { titre: "Premier contact", lignes: [["Porte sur", "la situation"], ["Définition", "toute interaction directe ou indirecte : toucher, inhalation, fluide, entrée en zone occupée, ouverture d'un contenant biologique"]], src: "DOREX §4.1" },
          { titre: "EXPOSÉ / Sujet EXO", lignes: [["Porte sur", "une personne"], ["Définition", "tout personnel ayant évolué en environnement EXO ou susceptible d'avoir été affecté ; statut maintenu jusqu'à infirmation (détection, quarantaine, expertise médicale)"]], src: "EOD §3.4" },
          { titre: "Contaminé", lignes: [["Porte sur", "une personne"], ["Définition", "exposition confirmée, contact avec un fluide ou un organisme, inhalation en zone suspecte, blessure en zone non sécurisée, physiologie anormale après contact"]], src: "DOREX §5.1" },
          { titre: "SUSPECT BIOLOGIQUE", lignes: [["Porte sur", "une personne"], ["Définition", "apparition de symptômes compatibles"]], src: "EOD §4.4" },
          { titre: "CONTAMINATION INDÉTERMINÉE", lignes: [["Porte sur", "une personne"], ["Définition", "changement de personnalité (voir Procédures)"]], src: "DOREX §10.5" },
          { titre: "Disparu", lignes: [["Porte sur", "une personne ou une équipe"], ["Définition", "silence radio de plus de 5 min, perte de signal, pas de réponse, disparition visuelle, rapports incohérents"]], src: "DOREX §9.1" },
          { titre: "DISPARUE PROBABLE", lignes: [["Porte sur", "une équipe"], ["Définition", "silence de 20 à 60 min"]], src: "DOREX §9.5" },
          { titre: "DISPARITION EXO PROBABLE", lignes: [["Porte sur", "une équipe"], ["Définition", "aucune trace retrouvée (ou traces inconnues / EXO, ✔ règle de table)"]], src: "DOREX §9.11" },
          { titre: "MENACE NIVEAU 4", lignes: [["Porte sur", "une entité"], ["Définition", "apprentissage, anticipation, imitation de comportements humains, adaptation tactique, changement de stratégie"]], src: "EOD §5.4" },
          { titre: "CRISE MAJEURE", lignes: [["Porte sur", "la situation"], ["Définition", "un des six critères de crise (voir Matrice de décision) ; déclenche le niveau 4"]], src: "DOREX §11.1" } ] },
        { titre: "Sigles et termes", items: [
          "**N0 à N5** — niveaux d'alerte DOREX (échelle EOD).",
          ["**C0 à C4** — niveaux de confinement d'une zone. C0 = zone saine / non classée.", "DOREX §7.3 ; C0 ✔ règle de table"],
          ["**ROE** — règles d'engagement (« Rules of Engagement ») : force permise, niveaux 0 à 5.", "ROED"],
          ["**NBC** — protection nucléaire, biologique, chimique : protection respiratoire intégrale, combinaison étanche, protection oculaire, gants et surbottes, contrôle d'étanchéité avant engagement.", "EOD §3.3"],
          ["**IA de bord** — support décisionnel de la chaîne de commandement ; peut ordonner neutralisation, sacrifice de zone, hausse du ROE.", "DOREX §1.3, EOD §5.3, §6.4"],
          ["**Silence opérationnel** — communications vitales uniquement, aucune émission non critique.", "EOD §6.7"],
          ["**Bunkerisation** — repli et scellement hermétique quand l'évacuation est impossible.", "EOD §6.3"],
          ["**Sacrifice de zone** — dépressurisation, verrouillage permanent, destruction ; la zone est perdue à jamais.", "EOD §6.4"],
          "**AUTO** (badge) — passage automatique, sans validation du commandement.",
          "**VALIDATION CDT** (badge) — passage après validation du commandement.",
          "**+1** (badge) — niveau actif au moment de l'événement, plus un.",
          "**✔ règle de table** — arbitrage retenu pour la partie quand les documents se taisent ou se contredisent." ] }
      ] },

      { id: "niveaux", titre: "Niveaux DOREX 0 à 5", blocs: [
        { gen: "recapNiveaux" },
        { titre: "Règles de passage", items: [
          ["**0 → 1** : immédiat sur critère ; doute → niveau supérieur.", "EOD §1.7"],
          ["**1 → 2** : immédiat ; le doute suffit.", "EOD §2.8"],
          ["**2 → 3** : immédiat sur critère ; situation de N2 non résolue → N3 **après validation du commandement**.", "EOD §3.8, §4.1"],

          note: ["Un niveau peut être sauté : test des 5 questions avec 2 « oui » ou plus → N2 direct ; adaptation comportementale → N4. Chaque changement de niveau s'annonce à la radio.", "DOREX §3.4, §8.5"] },

      ] },

      { id: "matrice", titre: "Matrice de décision", blocs: [
        { titre: "Comment lire la matrice", items: [
          "Le **niveau requis** est le plus élevé de tous les déclencheurs actifs (événements et zones).",
          ["**Sans badge de mode** : passage immédiat dès que le critère est constaté ; le doute suffit.", "EOD §2.8"],
          ["**AUTO** : passage automatique, sans validation du commandement.", "EOD §4.7, §6.1, DOREX §11.1"],
          ["**VALIDATION CDT** : passage après validation du commandement.", "EOD §4.1, §5.1"],
          ["**+1** : niveau actif au moment de l'événement, plus un.", "DOREX §9.11, §10.4"],
          "**STATUT** : l'événement donne un statut sans imposer de niveau." ] },
        { gen: "matrice" },
        { titre: "Validation du commandement", items: [
          ["**Validation requise** : situation de N2 non résolue → N3 ; situation de N3 hors contrôle → N4.", "EOD §4.1, §5.1"],
          ["**Sans validation** : propagation confirmée → N4 ; crise majeure → N4 ; adaptation comportementale → N4 ; N4 non contenu → N5.", "EOD §4.7, §6.1, DOREX §8.5, §11.1"],
          ["Dans l'appli : si le niveau visé n'est imposé que par un déclencheur « validation », la fenêtre de confirmation propose « Validé » ou « Non validé » ; un refus laisse un avertissement affiché.", "fonctionnement de l'appli"] ] },
        { gen: "minuteries" },
        { titre: "Désescalade", items: [
          ["Les documents ne prévoient **aucune procédure de désescalade** : c'est voulu par l'auteur de la doctrine.", "✔ règle de table"],
          ["Une zone contaminée reste fermée jusqu'à validation complète de la neutralisation biologique.", "DOREX §7.1"],
          ["La disparition des symptômes n'est **pas** une amélioration : maintenir la surveillance.", "DOREX §10.9"] ] },
        { titre: "Désescalade dans l'appli", items: [
          "Décocher un événement ou baisser une zone fait redescendre le niveau au maximum imposé par ce qui reste actif, **seulement** si le niveau actif était justifié par les déclencheurs.",
          "Un niveau monté à la main n'est pas redescendu automatiquement.",
          "Bouton « Baisser le niveau » (onglet Niveau) : la confirmation liste les déclencheurs encore actifs ; s'ils imposent plus, un avertissement reste affiché.",
          "Événement « +1 » : le niveau de base est figé au moment où il est coché ; le décocher puis le recocher recalcule cette base." ] }
      ] },

      { id: "roe", titre: "Règles d'engagement", blocs: [
        { titre: "Synchronisation avec le niveau DOREX", src: "ROED §0.0", items: [
          "**Le niveau DOREX actif fixe le niveau ROE minimal.**",
          "Aucun engagement en deçà des restrictions du niveau DOREX en cours.",
          "Le commandement ou l'IA de bord peut **relever** le ROE, jamais le baisser sous le seuil DOREX.",
          "S'applique à tous : militaires, drones armés, systèmes autonomes de défense, IA de bord, plateformes de confinement. Toute déviation = faille de doctrine critique." ] },
        { titre: "Principes d'engagement", src: "ROED Résumé", items: [
          "Force proportionnée", "**Confinement avant destruction**", "Protection des personnels", "Limitation de la propagation", "Coordination obligatoire" ] },
        { gen: "roe" },
        { titre: "Conditions de tir, armes et drones", items: [
          ["Armes autorisées **uniquement si** menace confirmée **et** extraction impossible **et** risque immédiat pour l'équipage ; sinon **retrait prioritaire**. Vaut surtout aux niveaux 1 et 2 ; au-delà, le ROE du niveau prime.", "DOREX §8.3 — ✔ règle de table"],
          ["ROE 0 : aucun armement actif, aucune visée.", "ROED §1.0"],
          ["ROE 1 : pas de verrouillage de tir ; drones armés interdits sauf ordre direct.", "ROED §2.0"],
          ["ROE 2 : tir uniquement sur menace directe confirmée ; aucune poursuite, aucune frappe préventive.", "ROED §3.0"],
          ["Niveau 0 : drone uniquement sur ordre du commandement ou en cas de perte de visibilité.", "EOD §1.3 — ✔ règle de table"],
          ["Niveau 1 : explosifs et armes lourdes interdits.", "EOD §2.5"],
          ["À partir du niveau 2, les personnels exposés sont désarmés.", "EOD §3.4"],
          ["Interdit envers une entité : la nourrir, l'attirer, simuler ses comportements, tester sa réaction sans autorisation.", "DOREX §8.4"] ] },
        { titre: "Conséquences pour l'équipe", items: [
          ["ROE 3 : un membre contaminé qui franchit un périmètre est une « entité franchissant un périmètre ».", "ROED §4.0"],
          ["ROE 5 : engagement sans distinction de cible ; les systèmes automatisés visent tout ce qui est biologiquement suspect, membres exposés de l'équipe compris.", "ROED §6.0"] ] }
      ] },

      { id: "zones", titre: "Zones de confinement", blocs: [
        { titre: "Principe", items: [
          ["Le confinement prime sur toute opération. Une zone contaminée reste fermée **jusqu'à validation complète de la neutralisation biologique**.", "DOREX §7.1"],
          ["Le niveau DOREX (0 à 5) qualifie la **situation** ; le niveau C qualifie l'**état d'une zone**. Plusieurs zones peuvent avoir des niveaux C différents sous un même niveau DOREX.", "✔ règle de table"] ] },
        { gen: "zonesC" },
        { gen: "zonesCorrespondance" },
        { titre: "Délimitation dès suspicion", src: "DOREX §7.2", ordre: true, items: [
          "Fermeture des accès physiques", "Verrouillage des sas", "Isolement de la ventilation", "Mise en quarantaine du secteur entier", "Marquage lumineux d'alerte" ] },
        { titre: "Accès et sas", src: "DOREX §7.4", items: [
          "Aucun accès ne s'ouvre sans **validation sécurité + validation scientifique + enregistrement automatique**.",
          "En cas de doute, **le sas reste fermé**." ] },
        { titre: "Ventilation et atmosphère", src: "DOREX §7.5", items: [
          "Toute contamination aérienne est **critique** : arrêt de la ventilation de la zone, isolation des filtres, analyse atmosphérique complète, remplacement si doute.",
          ["Au niveau 3, toute ventilation suspecte est arrêtée.", "EOD §4.3"] ] },
        { titre: "Rupture de confinement", src: "DOREX §7.6", intro: "Si une entité ou une contamination sort de la zone :", ordre: true, items: [
          "Fermeture immédiate du secteur", "Alerte générale", "Évacuation des zones adjacentes", "Déploiement des unités armées", "Suivi de trajectoire obligatoire" ],
          note: ["Selon l'ampleur : rupture locale → N3 ; rupture totale du confinement sectoriel → N4 ; contamination hors zone de confinement = CRISE MAJEURE → N4.", "EOD §3.8, §5.1, DOREX §11.1"] },
        { titre: "Disparition en zone EXO / BIO", src: "DOREX §9.7, EOD §4.5", items: [
          "Zone **C2 minimum**, drones uniquement, accès secondaires fermés, ventilation réduite ou coupée, périmètre fermé." ] },
        { titre: "Principe de sacrifice", src: "DOREX §7.7, §11.6 ; EOD §5.3, §6.4", items: [
          "Si la propagation ne peut être contenue : isolement complet du module, dépressurisation possible, destruction structurelle autorisée.",
          "**Uniquement sur ordre du commandement ou de l'IA de bord.**",
          "Zone sacrifiée = perdue définitivement.",
          "« Une perte localisée est préférable à une contamination globale. »" ] }
      ] },

      { id: "procedures", titre: "Procédures par situation", sous: [
        { titre: "Découverte passive — test des 5 questions", src: "DOREX §3", blocs: [
          { intro: "Première identification d'un élément inconnu **sans interaction** : signature thermique anormale, mouvement à distance, masse organique inconnue, signal biologique incohérent, structure vivante supposée. Correspond aux niveaux 0 → 1." },
          { titre: "Protocole", src: "DOREX §3.2", ordre: true, items: [
            "Arrêt immédiat de la progression", "Périmètre de sécurité", "Capteurs longue portée",
            ["Drone : uniquement sur ordre du commandement", "EOD §1.3 — ✔ règle de table"],
            "Enregistrement continu (vidéo + bio-scan)" ] },
          { titre: "Interdits absolus", src: "DOREX §3.3", interdits: true, items: [
            "Approche manuelle", "Contact physique", "Éclairage agressif (flash, stroboscope)", "Prélèvement", "Décision individuelle" ] },
          { titre: "Test des 5 questions", src: "DOREX §3.4", ordre: true, items: [
            "Est-ce mobile ?", "Réagit-il à un stimulus ?", "Y a-t-il une croissance visible ?", "Y a-t-il plusieurs entités similaires ?", "Le comportement est-il répétitif ou organique ?" ],
            note: "**2 « oui » ou plus → niveau 2 minimum** (le niveau 1 peut être sauté)." } ] },
        { titre: "Premier contact et cas critiques", src: "DOREX §4", blocs: [
          { intro: ["Toute interaction directe ou indirecte : toucher, inhalation, exposition à un fluide, entrée dans une zone occupée, ouverture d'un contenant biologique. Correspond au niveau 2.", "DOREX §4.1"] },
          { titre: "Procédure immédiate", src: "DOREX §4.2", ordre: true, items: [
            "STOP activité",
            ["Annonce radio : « Escouade X, annonce DOREX prioritaire : passage en niveau 2 »", "✔ règle de table"],
            "Isolement de la zone", "Désignation du sujet exposé", "Déploiement médical" ] },
          { titre: "Cas critiques", src: "DOREX §4.3", cartes: [
            { titre: "Contact avec un fluide inconnu", texte: "désinfection immédiate, retrait de l'équipement, confinement individuel" },
            { titre: "Inhalation suspectée", texte: "arrêt de la ventilation de la zone, isolement du secteur complet, tests atmosphériques" },
            { titre: "Blessure ouverte en zone inconnue", texte: "contamination présumée immédiate, **niveau 3 automatique**", src: "✔ règle de table (principe de précaution)" } ] } ] },
        { titre: "Contamination personnelle", src: "DOREX §5", blocs: [
          { titre: "Qui est contaminé", src: "DOREX §5.1", items: [
            "exposition confirmée", "contact avec un fluide ou un organisme", "inhalation en zone suspecte", "blessure en environnement non sécurisé", "physiologie anormale après contact" ],
            note: ["Tout exposé potentiel reçoit d'abord le statut **EXPOSÉ / Sujet EXO**.", "EOD §3.4"] },
          { titre: "Mesures immédiates", src: "DOREX §5.2, EOD §3.4", ordre: true, items: [
            "Désarmement du sujet", "Isolement physique", "Surveillance continue (biométrie + vidéo)", "Interdiction de contact avec l'équipage", "Décontamination contrôlée si autorisée" ],
            note: ["Le sujet est un point de contamination potentiel jusqu'à validation médicale complète. Statut opérationnel conservé uniquement sur décision médicale.", "DOREX §5.4, EOD §3.4"] },
          { titre: "Interdits en cas de suspicion", src: "DOREX §10.7", interdits: true, items: [
            "Contact physique non protégé", "Discussion non supervisée", "Transport en zone commune", "Usage de l'individu comme guide" ] },
          { items: [["**Non-confiance** : aucun exposé n'est exempt de contamination.", "DOREX §10.8"]] } ] },
        { titre: "Symptômes et règle des symptômes", src: "DOREX §10, EOD §4.4", blocs: [
          { titre: "Règle des symptômes", src: "DOREX §10.6, EOD §4.4", cartes: [
            { titre: "1 symptôme", texte: "surveillance renforcée" },
            { titre: "2 symptômes", texte: "**isolement immédiat**" },
            { titre: "3 symptômes", texte: "**confinement strict**" },
            { titre: "4 symptômes ou plus", texte: "**intervention sécurisée**" } ],
            note: ["Symptômes compatibles (statut SUSPECT BIOLOGIQUE) : fièvre inexpliquée, lésions cutanées, hallucinations ou confusion, agressivité soudaine, troubles cognitifs, comportement obsessionnel, perte de reconnaissance de l'environnement ou de l'équipage.", "EOD §4.4"] },
          { titre: "Symptômes physiques gradués", src: "DOREX §10.2", cartes: [
            { titre: "Léger", lignes: [["Symptômes", "fatigue inhabituelle, légère fièvre, irritation cutanée, toux sèche, picotements"], ["Mesure", "surveillance renforcée"]] },
            { titre: "Intermédiaire", lignes: [["Symptômes", "fièvre persistante, lésions cutanées, douleurs internes, tremblements, troubles visuels"], ["Mesure", "**isolement immédiat**"]] },
            { titre: "Critique", lignes: [["Symptômes", "hémorragies, déformations corporelles, perte de mobilité, sécrétions inconnues, croissance tissulaire anormale"], ["Mesure", "**quarantaine renforcée + intervention médicale d'urgence**"]] } ] },
          { titre: "Symptômes neurologiques", src: "DOREX §10.3", intro: "→ contamination **cognitive**", items: [
            "confusion", "perte de mémoire récente", "désorientation spatiale", "hallucinations auditives ou visuelles", "perte de reconnaissance des membres d'équipage" ] },
          { titre: "Symptômes comportementaux", src: "DOREX §10.4", intro: "→ **niveau d'alerte +1 automatique**", items: [
            "agressivité soudaine", "isolement volontaire", "refus des ordres", "fascination pour les zones contaminées", "protection d'un organisme ou d'une structure" ] },
          { titre: "Signes d'évolution critique", src: "DOREX §5.3", items: [
            "fièvre inexpliquée, modification cutanée, hallucinations ou confusion, agressivité soudaine, comportement obsessionnel, perte de reconnaissance sociale" ] },
          { titre: "Disparition des symptômes", src: "DOREX §10.9", items: [
            "Ce n'est **pas** une amélioration : adaptation biologique, phase dormante ou modification comportementale avancée → **maintenir la surveillance**." ] } ] },
        { titre: "Changement de personnalité", src: "DOREX §10.5", blocs: [
          { intro: "Statut **CONTAMINATION INDÉTERMINÉE** si le sujet :", items: [
            "a un comportement incohérent avec son historique",
            "a des priorités vitales modifiées",
            "montre une **connaissance impossible de la zone**",
            "agit comme s'il « répondait à autre chose »" ],
            note: ["Tout changement après une exposition = contamination jusqu'à preuve du contraire.", "DOREX §10.1"] } ] },
        { titre: "Structures exobiologiques A à E", src: "DOREX §6", blocs: [
          { titre: "Classement EXO — un critère suffit", src: "DOREX §6.1", items: [
            "origine inconnue", "composition organique non référencée", "réaction à la présence humaine", "croissance ou modification dans le temps", "émission de chaleur, de gaz ou de signal biologique", "comportement cyclique ou pulsatile" ],
            note: ["**Règle absolue** : toute structure peut être vivante, même immobile.", "DOREX §6.2"] },
          { titre: "Typologie", src: "DOREX §6.3", cartes: [
            { titre: "A — Masse organique indifférenciée", lignes: [["Aspect", "amas, parois, tissus, couches superposées"], ["Risques", "digestion lente, réaction au contact, effondrement ou contraction"], ["Procédure", "observation à distance, scan thermique, aucun contact"]] },
            { titre: "B — Structure creuse / cavitaire", lignes: [["Aspect", "tunnels, cavités, alvéoles, conduits"], ["Risques", "habitat actif, pièges biologiques, propagation interne"], ["Procédure", "**drone uniquement**, marquage des entrées, aucune pénétration non sécurisée"]] },
            { titre: "C — Structure ovoïde / encapsulée", lignes: [["Aspect", "sphères, capsules, masses lisses"], ["Risques", "incubation, déclenchement par contact ou vibration, libération soudaine"], ["Procédure", "**périmètre de 20 m minimum**, aucun choc ni vibration, destruction **uniquement sur ordre, niveau 4 ou plus**"]] },
            { titre: "D — Réseau fibreux / organique étendu", lignes: [["Aspect", "racines, nervures, membranes, filaments"], ["Risques", "propagation rapide, connexion entre zones, réaction en chaîne"], ["Procédure", "cartographie complète, aucune rupture physique, identifier les points nodaux"]] },
            { titre: "E — Structure réactive", lignes: [["Aspect", "contraction, pulsation, mouvement lent ; réagit à la lumière, au bruit, à la chaleur"], ["Risques", "intelligence biologique possible, défense active, adaptation"], ["Procédure", "réduire les stimuli, silence opérationnel, observation prolongée"]] } ] },
          { titre: "Interdits absolus", src: "DOREX §6.4", interdits: true, items: [
            "Couper une structure supposée vivante", "Insérer un instrument sans validation scientifique", "Éclairer agressivement", "Injecter ou pulvériser sans ordre", "Retirer un objet incrusté", "Ouvrir une cavité organique" ] },
          { titre: "Équipage en zone EXO", src: "DOREX §6.5", items: [
            "Posture statique ; communication minimale ; lecture des capteurs uniquement ; signalement immédiat de toute modification.",
            ["Parler dans une zone EXO silencieuse est une erreur critique.", "DOREX A6"] ] } ] },
        { titre: "Menaces mobiles", src: "DOREX §8", blocs: [
          { intro: ["Toute entité capable de déplacement autonome, de réaction aux stimuli, de poursuite ou d'évitement, d'attaque ou de défense est classée **ORG ou EXO mobile**.", "DOREX §8.1"] },
          { titre: "Comportements", src: "DOREX §8.2", cartes: [
            { titre: "Passif — N1", lignes: [["Indicateurs", "immobilité, réaction lente, aucune agression"], ["Réponse", "surveillance uniquement, maintien du périmètre"]], src: "DOREX §8.2, EOD §2.6" },
            { titre: "Exploratoire — N1", lignes: [["Indicateurs", "déplacements sans cible, réagit aux sons et à la lumière, teste l'environnement"], ["Réponse", "distance augmentée + drones, moins d'émissions lumineuses et sonores"]], src: "DOREX §8.2, EOD §2.6" },
            { titre: "Territorial — N2 minimum", lignes: [["Indicateurs", "défense d'une zone, attaques préventives, marquage biologique, protège une structure"], ["Réponse", "**retrait immédiat**, observation indirecte"]], src: "✔ règle de table — DOREX §8.2, EOD §3.7" },
            { titre: "Prédatoire — N3 minimum", lignes: [["Indicateurs", "poursuite ciblée, attaque dirigée, anticipation, interception, embuscade, action coordonnée"], ["Réponse", "interruption de mission, préparation du confinement, renfort immédiat"]], src: "✔ règle de table — DOREX §8.2" },
            { titre: "Adaptatif — N4 automatique", lignes: [["Indicateurs", "change de stratégie, apprend des humains, évite les pièges, anticipe les déplacements, imite des comportements humains"], ["Réponse", "statut MENACE NIVEAU 4"]], src: "DOREX §8.5, EOD §5.4" } ],
            items: [
              ["Tout changement brutal de comportement → réévaluation immédiate.", "EOD §2.6"],
              ["Toute capacité de poursuite est un facteur aggravant.", "EOD §3.7"] ] },
          { titre: "Engagement", src: "DOREX §8.3", items: [
            "Armes seulement si menace confirmée **et** extraction impossible **et** risque immédiat ; sinon **retrait** (voir Règles d'engagement)." ] },
          { titre: "Interactions interdites", src: "DOREX §8.4", interdits: true, items: [
            "Nourrir l'entité", "L'attirer", "Simuler ses comportements", "Tester sa réaction sans autorisation" ] } ] },
        { titre: "Personnel disparu et silence radio", src: "DOREX §9", blocs: [
          { gen: "minuteries" },
          { titre: "Règles", items: [
            ["**Non-séparation** : aucune recherche seul, sans radio ou sans traceur actif.", "DOREX §9.6"],
            ["**Disparition en zone EXO / BIO** : zone C2 minimum, drones uniquement, accès secondaires fermés, ventilation réduite ou coupée.", "DOREX §9.7"],
            ["**Récupération** : formation serrée, couverture visuelle complète, analyse continue des surfaces, pas de séparation, extraction rapide uniquement. **Aucun corps déplacé sans inspection préalable.**", "DOREX §9.10"],
            ["Recherche et récupération = opération NBC : 3 minimum, radio permanente, drone en tête, couverture mutuelle, vidéo individuelle ; toute perte de contact arrête la progression.", "EOD §3.6"] ] },
          { titre: "Indices trompeurs", src: "DOREX §9.8, §9.9", items: [
            "**Ne garantissent pas la survie** : bruits dans les conduits, traces biologiques, mouvements détectés, objets déplacés, signaux radio intermittents. Toute interprétation émotionnelle est interdite.",
            "**Signal retrouvé** : envisager falsification, comportement non humain, **imitation de communication**, contamination cognitive ou biologique. Aucune réponse directe sans validation." ] },
          { items: [["**Substitution** : toute équipe disparue est potentiellement **remplacée, imitée ou intégrée** à l'environnement biologique.", "DOREX §9.12"]] } ] },
        { titre: "Crise et perte de contrôle", src: "DOREX §11, EOD ch. 5–6", blocs: [
          { gen: "crise" } ] },
        { titre: "Checklists réflexes A1 à A7", src: "DOREX §12", blocs: [
          { titre: "A1 — Entrée en zone inconnue", coches: true, items: [
            "communication active", "caméra opérationnelle", "analyse atmosphérique effectuée", "combinaison scellée", "arme prête (niveau de sécurité validé)", "drone déployé si possible", "itinéraire de sortie défini" ] },
          { titre: "A2 — Découverte", coches: true, items: [
            "arrêter tout mouvement", "établir la distance minimale", "observer sans interaction", "scanner l'environnement", "signaler à la chaîne de commandement", "interdire tout contact physique" ] },
          { titre: "A3 — Contamination suspectée", coches: true, items: [
            "isoler l'individu", "couper le contact avec l'équipe", "désarmer si nécessaire", "surveiller les signes vitaux", "lancer l'analyse médicale", "interdire le retour en zone commune" ] },
          { titre: "A4 — Matrice de réaction rapide", items: [
            "Organisme inconnu immobile → **observation distante**",
            "Organisme mobile → **recul + drones**",
            "Fluide inconnu → **isolement de la zone**",
            "Disparition d'équipe → **procédure personnel disparu**",
            "Symptômes multiples → **quarantaine**",
            "Rupture de communication → **alerte progressive**" ] },
          { titre: "A5 — Priorités en intervention", ordre: true, items: [
            "Sécurité du bâtiment / vaisseau", "Confinement biologique", "Protection des équipes restantes", "Récupération du matériel", "Sauvetage individuel" ] },
          { titre: "A6 — Erreurs critiques récurrentes", interdits: true, items: [
            "Supposer un organisme mort", "Retirer un masque trop tôt", "Entrer seul en zone inconnue", "Séparer une équipe pour enquêter", "Ignorer un symptôme léger", "Toucher sans analyse", "Parler dans une zone EXO silencieuse", "Ouvrir un conteneur non validé" ] },
          { titre: "A7 — Rappel final", items: [
            "**Ce qui n'est pas compris est dangereux. Ce qui est silencieux est surveillé. Ce qui est vivant est contenu.**" ] } ] }
      ] }
    ],

    /* Compléments des fiches de niveau (le reste vient de DOREX_DATA.niveaux).
       remplaceNotes : les notes courtes du niveau sont remplacées par les compléments détaillés. */
    fiches: [
      { mission: "Recueillir un maximum d'informations sans modifier l'environnement observé.",
        declencheurs: { src: "EOD §1.1", items: [
          "signature thermique anormale", "mouvement détecté hors identification", "masse organique non répertoriée", "émission biologique inexpliquée",
          "structure d'origine inconnue", "modification inhabituelle de l'environnement", "lecture incohérente des capteurs" ],
          note: "Sans confirmation, toute anomalie est potentiellement exobiologique." },
        complements: [
          { titre: "Observation", src: "EOD §1.3", items: ["Établir : nature, localisation précise, dimensions, mobilité, évolution dans le temps, influence sur l'environnement."] } ] },
      { mission: "Garder la maîtrise, établir un périmètre, recueillir le renseignement.",
        declencheurs: { src: "EOD §2.1", items: [
          "observation visuelle d'une entité inconnue", "identification d'une structure biologique ou exobiologique", "mouvement autonome confirmé",
