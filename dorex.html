/* =====================================================================
   LOGIQUE
   ===================================================================== */
const CLE = "dorex-app-v1";
const NIV = DOREX_DATA.niveaux;
const EV = Object.fromEntries(DOREX_DATA.evenements.map(e => [e.id, e]));
const ZC = DOREX_DATA.zones;
const ESC = DOREX_DATA.escouade;
const SANTE = Object.fromEntries(ESC.sante.map(s => [s.id, s]));
const STATUTS = Object.fromEntries(ESC.statuts.map(s => [s.id, s]));
const PARTIE = Object.fromEntries(ESC.corps.map(p => [p.id, p]));
/* Catégories du journal, et catégorie par défaut de chaque type d'entrée */
const CATS = { dorex: "DOREX", escouade: "Escouade", autre: "Autre" };
const CAT_TYPE = { niveau: "dorex", refus: "dorex", evenement: "dorex", zone: "dorex", mesure: "dorex", marine: "escouade", note: "autre", systeme: "autre" };
function catDe(type) { return CAT_TYPE[type] || "autre"; }

function etatVide(reglages) {
  return {
    v: 1, niveau: 0, events: {}, zones: [], mesures: {}, journal: [], refus: null, marines: [],
    reglages: Object.assign({ escouade: "", theme: "vert", scan: true }, reglages || {})
  };
}
let S = etatVide();

function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) S = normaliser(JSON.parse(brut));
  } catch (e) { /* stockage indisponible : on part d'un état vide */ }
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { /* ignoré */ }
}
function normaliser(o) {
  const s = etatVide(o && o.reglages);
  if (!o || typeof o !== "object") return s;
  const n = Number(o.niveau);
  s.niveau = Number.isInteger(n) && n >= 0 && n <= 5 ? n : 0;
  if (o.events && typeof o.events === "object") {
    for (const [id, v] of Object.entries(o.events)) if (EV[id] && v && v.on) s.events[id] = { on: true, t: v.t || null, base: Number.isInteger(v.base) ? v.base : 0 };
  }
  if (Array.isArray(o.zones)) s.zones = o.zones.filter(z => z && typeof z.nom === "string").map(z => ({ id: String(z.id || uid()), nom: z.nom, c: Math.min(4, Math.max(0, Number(z.c) || 0)), t: z.t || null }));
  if (o.mesures && typeof o.mesures === "object") s.mesures = o.mesures;
  // Anciennes entrées sans catégorie : déduite du type
  if (Array.isArray(o.journal)) s.journal = o.journal.filter(j => j && j.txt).slice(-2000).map(j => Object.assign({}, j, { cat: CATS[j.cat] ? j.cat : catDe(j.type) }));
  s.refus = Number.isInteger(o.refus) ? o.refus : null;
  // Anciennes sauvegardes : pas de marines → tableau vide
  if (Array.isArray(o.marines)) {
    const ids = new Set();
    s.marines = o.marines.filter(m => m && typeof m === "object").slice(0, 40).map(normMarine)
      .filter(m => !ids.has(m.id) && ids.add(m.id));
  }
  return s;
}
/* Fiche marine validée : textes tronqués, stress entier 0–10, statut / santé pris dans les listes,
   compteurs d'équipement entiers ≥ 0, blessures seulement pour les 6 parties connues :
   liste de { id, txt, t (date ISO de l'ajout ou null), soignee } par partie, 30 au plus, texte vide écarté.
   Ancien format (une note texte par partie) → liste d'une blessure non soignée, date inconnue. */
function normMarine(m) {
  m = m || {};
  const txt = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
  const st = Number(m.stress);
  const bl = {};
  if (m.blessures && typeof m.blessures === "object") for (const p of ESC.corps) {
    const v = m.blessures[p.id], ids = new Set();
    const src = typeof v === "string" ? [{ txt: v }] : Array.isArray(v) ? v : [];
    const l = src.filter(b => b && typeof b === "object").slice(0, 30).map(b => {
      let id = txt(b.id, 40); if (!id || ids.has(id)) id = uid(); ids.add(id);
      return { id, txt: txt(b.txt, 300).trim(), t: typeof b.t === "string" && !isNaN(Date.parse(b.t)) ? b.t : null, soignee: b.soignee === true };
    }).filter(b => b.txt);
    if (l.length) bl[p.id] = l;
  }
  return {
    id: String(m.id || uid()), nom: txt(m.nom, 60), pseudo: txt(m.pseudo, 40), matricule: txt(m.matricule, 30), classe: txt(m.classe, 60),
    stress: Number.isInteger(st) ? Math.min(10, Math.max(0, st)) : 0,
    statut: STATUTS[m.statut] ? m.statut : "aucun",
    sante: SANTE[m.sante] ? m.sante : "excellent",
    equip: Array.isArray(m.equip) ? m.equip.filter(q => q && typeof q === "object").slice(0, 60)
      .map(q => ({ id: String(q.id || uid()), lib: txt(q.lib, 80), n: Math.min(99999, Math.max(0, Math.floor(Number(q.n)) || 0)) })) : [],
    blessures: bl
  };
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---------- Calcul du niveau requis ----------
   Niveau requis = max de tous les déclencheurs actifs :
   - événement coché à niveau fixe → son niveau minimal ;
   - événement « niveau +1 » → (niveau de base mémorisé au moment où il est coché) + 1, plafonné à 5.
     Base = max(niveau actif, niveau requis par les autres déclencheurs) à cet instant.
   - zone Cx → niveau minimal de la zone (C1→2, C2→3, C3→4, C4→4) ;
   - 2 zones C4 ou plus → 5.
   Retourne { niveau, sources:[{lib, niveau, mode, src, type}] }. */
function niveauEvent(id, st) {
  const e = EV[id], v = st.events[id];
  if (!e || !v || !v.on) return null;
  if (e.rel) return Math.min(5, (v.base || 0) + 1);
  return e.niveau;
}
function requis(st, exclureId) {
  st = st || S;
  const sources = [];
  for (const id of Object.keys(st.events)) {
    if (id === exclureId) continue;
    const n = niveauEvent(id, st);
    if (n === null || n === undefined) continue;
    const e = EV[id];
    sources.push({ type: "ev", id, lib: e.lib, niveau: n, mode: e.mode, src: e.src, rel: !!e.rel });
  }
  let nbC4 = 0;
  for (const z of st.zones) {
    if (z.c === 4) nbC4++;
    const zc = ZC[z.c];
    if (zc.niveauMin > 0) sources.push({ type: "zone", id: z.id, lib: "Zone « " + z.nom + " » en C" + z.c, niveau: zc.niveauMin, mode: "immediat", src: "✔ règle de table — correspondance zone / niveau" });
  }
  const m = DOREX_DATA.zonesC4Multiples;
  if (nbC4 >= m.seuil) sources.push({ type: "zone", id: "c4multi", lib: nbC4 + " zones en C4 (perte de contrôle de plusieurs zones critiques)", niveau: m.niveauMin, mode: "immediat", src: m.src });
  sources.sort((a, b) => b.niveau - a.niveau);
  const niveau = sources.length ? sources[0].niveau : 0;
  return { niveau, sources };
}

/* Validation du commandement requise pour atteindre `cible` depuis `actif` ?
   Oui si le niveau cible n'est imposé que par des déclencheurs en mode « validation ». */
function analysePassage(r, actif) {
  const au = r.sources.filter(s => s.niveau > actif);
  const maxLibre = Math.max(-1, ...au.filter(s => s.mode !== "validation").map(s => s.niveau));
  const validation = r.niveau > maxLibre;
  const auto = au.some(s => s.niveau === r.niveau && s.mode === "auto");
  return { au, validation, auto, maxLibre };
}

/* ---------- Journal ---------- */
/* cat : "dorex", "escouade" ou "autre" ; par défaut déduite du type (CAT_TYPE). Retourne l'entrée. */
function journal(type, txt, cat) {
  const j = { t: new Date().toISOString(), type, cat: CATS[cat] ? cat : catDe(type), txt };
  S.journal.push(j);
  return j;
}
function nomNiv(n) { return "N" + n + " " + NIV[n].nom; }

/* ---------- Changement de niveau ---------- */
function setNiveau(n, mode, detail) {
  const avant = S.niveau;
  if (n === avant) return;
  S.niveau = n;
  const libMode = { auto: "automatique", confirme: "confirmé", manuel: "manuel", valide: "validé par le commandement" }[mode] || mode;
  journal("niveau", "Niveau " + avant + " → " + n + " (" + NIV[n].nom + ") — " + libMode + (detail ? " : " + detail : ""));
  if (n >= requis().niveau) S.refus = null;
}

/* Appelée après toute modification des déclencheurs.
   avant = résultat de requis() avant la modification. */
function apresChangement(avant) {
  const apres = requis();
  // Redescente automatique : le niveau actif était couvert par les déclencheurs d'avant,
  // et ce qui reste actif impose moins → on descend au maximum restant.
  if (apres.niveau < avant.niveau && S.niveau <= avant.niveau && S.niveau > apres.niveau) {
    setNiveau(apres.niveau, "auto", "plus aucun déclencheur actif n'impose le niveau " + (apres.niveau + 1) + " ou plus");
  }
  if (apres.niveau <= S.niveau) S.refus = null;
  sauver();
  rendre();
  // Proposition de montée : le niveau requis dépasse le niveau actif ET, soit il a augmenté,
  // soit un nouveau déclencheur au-dessus du niveau actif vient d'apparaître
  // (ex. déclencheur automatique au même niveau qu'un passage déjà refusé).
  const cle = s => s.type + ":" + s.id + ":" + s.niveau;
  const deja = new Set(avant.sources.map(cle));
  const nouveau = apres.sources.some(s => s.niveau > S.niveau && !deja.has(cle(s)));
  if (apres.niveau > S.niveau && (apres.niveau > avant.niveau || nouveau)) proposerMontee(apres);
}

function proposerMontee(r) {
  const a = analysePassage(r, S.niveau);
  const cible = r.niveau;
  const lignes = a.au.map(s => `<li>${badgeNiv(s.niveau, s.rel)} ${esc(s.lib)} ${modeBadge(s.mode)} <span class="src">${esc(s.src)}</span></li>`).join("");
  let regle;
  if (a.validation) regle = `<p class="b-val"><b>⚠ VALIDATION DU COMMANDEMENT REQUISE</b> pour passer en niveau ${cible} <span class="src">(EOD §4.1, §5.1)</span>.</p>`;
  else if (a.auto) regle = `<p><b>Passage automatique</b> selon la doctrine, sans validation du commandement <span class="src">(EOD §4.7, §6.1, DOREX §11.1)</span>.</p>`;
  else regle = `<p><b>Passage immédiat sur critère.</b> Le doute suffit <span class="src">(EOD §2.8)</span>.</p>`;
  if (a.validation && a.maxLibre > S.niveau) regle += `<p>Sans cette validation, les autres déclencheurs imposent au moins le niveau ${a.maxLibre}.</p>`;
  const boutons = [
    { lib: a.validation ? "Validé : passer en N" + cible : "Passer en N" + cible, cls: "pri", act: () => { setNiveau(cible, a.validation ? "valide" : "confirme"); sauver(); rendre(); } }
  ];
  if (a.validation && a.maxLibre > S.niveau) {
    const nl = a.maxLibre;
    boutons.push({ lib: "Non validé : passer en N" + nl, cls: "", act: () => {
      setNiveau(nl, "confirme", "validation du commandement refusée pour le niveau " + cible);
      S.refus = cible; journal("refus", "Passage au niveau " + cible + " non validé — niveau requis supérieur au niveau actif"); sauver(); rendre(); } });
  }
  boutons.push({ lib: "Refuser", cls: "dang", act: () => {
    S.refus = cible; journal("refus", "Passage au niveau " + cible + " refusé (niveau actif " + S.niveau + ")"); sauver(); rendre(); } });
  modale({
    titre: "Niveau requis : " + cible + " — " + NIV[cible].nom,
    couleur: couleurNiv(cible),
    html: `<p>Niveau actif : <b>${nomNiv(S.niveau)}</b></p>
      <h3>Déclencheurs au-dessus du niveau actif</h3><ul class="plain">${lignes}</ul>
      ${regle}
      <div class="annonce">« ${esc(annonce(cible))} »</div>`,
    boutons
  });
}

/* ---------- Actions utilisateur ---------- */
function basculerEvent(id, on) {
  const avant = requis();
  const e = EV[id];
  if (on) {
    const base = Math.max(S.niveau, requis(S, id).niveau);
    S.events[id] = { on: true, t: new Date().toISOString(), base };
    const n = niveauEvent(id, S);
    journal("evenement", "☑ " + e.lib + (n !== null ? " [niveau " + (e.rel ? "+1 → " : "min ") + n + "]" : "") + (e.statut ? " — statut " + e.statut : ""));
  } else {
    delete S.events[id];
    journal("evenement", "☐ Décoché : " + e.lib);
  }
  apresChangement(avant);
}
function ajouterZone(nom, c) {
  const avant = requis();
  nom = (nom || "").trim() || "Secteur " + (S.zones.length + 1);
  S.zones.push({ id: uid(), nom, c, t: new Date().toISOString() });
  journal("zone", "Zone créée : « " + nom + " » en C" + c + " (" + ZC[c].nom + ")");
  apresChangement(avant);
}
function classerZone(id, c) {
  const z = S.zones.find(z => z.id === id); if (!z || z.c === c) return;
  const avant = requis();
  journal("zone", "Zone « " + z.nom + " » : C" + z.c + " → C" + c + " (" + ZC[c].nom + ")");
  z.c = c;
  apresChangement(avant);
}
function renommerZone(id, nom) {
  const z = S.zones.find(z => z.id === id); nom = (nom || "").trim();
  if (!z || !nom || nom === z.nom) return;
  journal("zone", "Zone « " + z.nom + " » renommée « " + nom + " »");
  z.nom = nom; sauver(); rendre();
}
function supprimerZone(id) {
  const z = S.zones.find(z => z.id === id); if (!z) return;
  modale({ titre: "Supprimer la zone ?", html: `<p>« ${esc(z.nom)} » (C${z.c}) sera retirée. Si elle imposait le niveau actif, le niveau redescendra automatiquement.</p>`,
    boutons: [{ lib: "Supprimer", cls: "dang", act: () => {
      const avant = requis();
      S.zones = S.zones.filter(x => x.id !== id);
      journal("zone", "Zone supprimée : « " + z.nom + " » (C" + z.c + ")");
      apresChangement(avant);
    } }, { lib: "Annuler" }] });
}
function cocherMesure(n, i, on) {
  const l = S.mesures[n] || (S.mesures[n] = []);
  l[i] = on;
  const txt = NIV[n].mesures.items[i].replace("« {ANNONCE} »", "annonce");
  journal("mesure", (on ? "☑ " : "☐ ") + "Mesure N" + n + " : " + txt);
  sauver(); rendre();
}

function changerNiveauManuel(sens) {
  const choix = [];
  for (let n = 0; n <= 5; n++) if (sens < 0 ? n < S.niveau : n > S.niveau) choix.push(n);
  if (!choix.length) return;
  modale({
    titre: sens < 0 ? "Baisser le niveau" : "Monter le niveau",
    html: `<p>Niveau actif : <b>${nomNiv(S.niveau)}</b>. Choisir le nouveau niveau :</p>
      <div class="choix-niv">${choix.map(n => `<button data-choix="${n}" class="b-n${n}"><b>${n}</b>${esc(NIV[n].nom)}</button>`).join("")}</div>`,
    boutons: [{ lib: "Annuler" }],
    apres: (corps) => corps.querySelectorAll("[data-choix]").forEach(b => b.addEventListener("click", () => { fermerModale(); confirmerManuel(Number(b.dataset.choix)); }))
  });
}
function confirmerManuel(n) {
  const r = requis();
  const bloquants = r.sources.filter(s => s.niveau > n);
  const baisse = n < S.niveau;
  let html = `<p>Passage manuel <b>${nomNiv(S.niveau)}</b> → <b>${nomNiv(n)}</b>.</p>`;
  if (baisse) {
    html += `<p class="src">Les sources ne prévoient aucune désescalade (✔ règle de table : volonté de l'auteur). Une zone contaminée reste fermée jusqu'à validation complète de la neutralisation biologique (DOREX §7.1) ; la disparition des symptômes n'est pas une amélioration (DOREX §10.9).</p>`;
    if (bloquants.length) html += `<h3 class="b-val">⚠ Encore actifs, imposent plus que N${n}</h3><ul class="plain">${bloquants.map(s => `<li>${badgeNiv(s.niveau, s.rel)} ${esc(s.lib)}</li>`).join("")}</ul><p>Le niveau requis restera supérieur au niveau actif (avertissement affiché).</p>`;
    else html += `<p>Aucun déclencheur actif n'impose plus que N${n}.</p>`;
  }
  html += `<div class="annonce">« ${esc(annonce(n))} »</div>`;
  modale({ titre: "Confirmer : niveau " + n, couleur: couleurNiv(n), html,
    boutons: [{ lib: (baisse ? "Baisser" : "Monter") + " en N" + n, cls: baisse ? "dang" : "pri", act: () => {
      setNiveau(n, "manuel", bloquants.length ? bloquants.length + " déclencheur(s) actif(s) imposent plus" : "");
      if (bloquants.length) S.refus = r.niveau;
      sauver(); rendre();
    } }, { lib: "Annuler" }] });
}

/* ---------- Escouade : actions ----------
   Journalisés (catégorie escouade) : ajout / retrait, état de santé, statut DOREX, stress, blessures.
   Identité et équipement : mis à jour dans S à chaque frappe, sans journal ni re-rendu (pas de perte de focus). */
function marine(id) { return S.marines.find(m => m.id === id); }
function nomMarine(m) { return m.pseudo.trim() || m.nom.trim() || m.matricule.trim() || "Marine sans nom"; }
function majEscouade() { sauver(); rendreEscouade(); rendreJournal(); }

function ajouterMarine() {
  const m = normMarine({ id: uid() });
  S.marines.push(m);
  mOuverts.clear(); mOuverts.add(m.id);  // une seule fiche dépliée : les autres se replient
  journal("marine", "Marine ajouté à l'escouade (fiche " + S.marines.length + ")");
  majEscouade();
  for (const [mid, x] of mNoeuds) if (mid !== m.id) x.open = false;
  const n = mNoeuds.get(m.id);
  if (n) { montrerFiche(n); n.querySelector('[data-f="nom"]').focus({ preventScroll: true }); }
}
function supprimerMarine(id) {
  const m = marine(id); if (!m) return;
  modale({ titre: "Retirer ce marine ?", couleur: "var(--red)", html: `<p>« ${esc(nomMarine(m))} » sera retiré de l'escouade, avec sa fiche (équipement, blessures).</p>`,
    boutons: [{ lib: "Retirer", cls: "dang", act: () => {
      S.marines = S.marines.filter(x => x.id !== id);
      mOuverts.delete(id);
      journal("marine", "Marine retiré de l'escouade : " + nomMarine(m));
      majEscouade();
    } }, { lib: "Annuler" }] });
}
function changerSante(id, v) {
  const m = marine(id); if (!m || !SANTE[v] || m.sante === v) return;
  journal("marine", nomMarine(m) + " : état de santé " + SANTE[m.sante].lib + " → " + SANTE[v].lib);
  m.sante = v; majEscouade();
}
function changerStatut(id, v) {
  const m = marine(id); if (!m || !STATUTS[v] || m.statut === v) return;
  journal("marine", nomMarine(m) + " : statut DOREX " + STATUTS[m.statut].lib + " → " + STATUTS[v].lib);
  m.statut = v; majEscouade();
}
/* Stress : les appuis successifs sur − / + en moins d'une minute sont regroupés dans une seule entrée
   (« 2 → 5 ») tant qu'aucune autre entrée n'a été écrite entre-temps ; retour à la valeur de départ = entrée retirée. */
function changerStress(id, d) {
  const m = marine(id); if (!m) return;
  const n = Math.min(10, Math.max(0, m.stress + d));
  if (n === m.stress) return;
  const der = S.journal[S.journal.length - 1];
  if (der && der.type === "marine" && der.mid === id && der.stressDe !== undefined && Date.now() - Date.parse(der.t) < 60000) {
    if (der.stressDe === n) S.journal.pop();
    else { der.txt = nomMarine(m) + " : stress " + der.stressDe + " → " + n; der.t = new Date().toISOString(); }
  } else {
    const j = journal("marine", nomMarine(m) + " : stress " + m.stress + " → " + n);
    j.mid = id; j.stressDe = m.stress;
  }
  m.stress = n; majEscouade();
}
/* Blessures : une liste par partie du corps. Une blessure soignée reste listée (barrée) ;
   seules les blessures non soignées comptent (compteur, marquage rouge du schéma). */
const BL_MAX = 30;
function nbActives(l) { return (l || []).filter(b => !b.soignee).length; }
function libBlessure(m, part) { return nomMarine(m) + " — Blessure " + PARTIE[part].lib.toLowerCase(); }
/* Liste d'une partie dans une modale qui reste ouverte : seule la liste est reconstruite à chaque action,
   le champ de saisie n'est jamais remplacé (ni focus ni texte perdus). Suppression en deux appuis
   (« Confirmer ? » pendant 3 s) plutôt qu'une seconde modale. */
function ouvrirBlessures(id, part) {
  const m = marine(id), p = PARTIE[part]; if (!m || !p) return;
  modale({ titre: "Blessures — " + p.lib, couleur: "var(--red)", boutons: [{ lib: "Fermer" }],
    html: `<p>${esc(nomMarine(m))}</p><ul class="bl-liste" id="blListe"></ul>
      <form class="bl-ajout" id="fBless" autocomplete="off">
        <input type="text" id="blTxt" maxlength="300" placeholder="Ex. : plaie par balle, brûlure acide…" aria-label="Nouvelle blessure">
        <button type="submit" class="btn pri">Ajouter</button></form>`,
    apres: c => {
      const ul = c.querySelector("#blListe"), t = c.querySelector("#blTxt");
      const maj = () => {
        const cle = ul.contains(document.activeElement) ? document.activeElement.dataset.f : null;
        ul.innerHTML = lignesBlessures(marine(id), part);
        const x = cle && [...ul.querySelectorAll("[data-f]")].find(el => el.dataset.f === cle);
        if (x) x.focus({ preventScroll: true }); else if (cle) t.focus({ preventScroll: true });
      };
      maj();
      c.querySelector("#fBless").addEventListener("submit", e => {
        e.preventDefault();
        if (ajouterBlessure(id, part, t.value)) { t.value = ""; maj(); }
        else if (t.value.trim()) t.placeholder = "Limite de " + BL_MAX + " blessures atteinte";
        t.focus({ preventScroll: true });
      });
      ul.addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.blsoin) { soignerBlessure(id, part, b.dataset.blsoin); return maj(); }
        if (!b.dataset.blsup) return;
        if (!b.dataset.arme) {
          b.dataset.arme = "1"; b.textContent = "Confirmer ?";
          setTimeout(() => { if (b.isConnected) { delete b.dataset.arme; b.textContent = "✕"; } }, 3000);
          return;
        }
        supprimerBlessure(id, part, b.dataset.blsup); maj();
      });
      t.focus({ preventScroll: true });
    } });
}
function dateCourte(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return "—";
  const p = x => String(x).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function lignesBlessures(m, part) {
  const l = (m && m.blessures[part]) || [];
  if (!l.length) return `<li class="vide">Aucune blessure notée.</li>`;
  return l.map(b => { const bid = esc(b.id);
    return `<li class="bl-it ${b.soignee ? "soignee" : ""}"><span class="bl-h">${dateCourte(b.t)}</span><span class="bl-tx">${esc(b.txt)}</span>
      <span class="bl-ctl"><button type="button" class="btn pt ${b.soignee ? "on" : ""}" data-f="soin-${bid}" data-blsoin="${bid}" aria-pressed="${b.soignee}">${b.soignee ? "☑" : "☐"} Soignée</button>
      <button type="button" class="btn dang pt" data-f="sup-${bid}" data-blsup="${bid}" aria-label="Supprimer la blessure">✕</button></span></li>`; }).join("");
}
function ajouterBlessure(id, part, texte) {
  const m = marine(id); if (!m || !PARTIE[part]) return false;
  texte = (texte || "").trim().slice(0, 300); if (!texte) return false;
  const l = m.blessures[part] || (m.blessures[part] = []);
  if (l.length >= BL_MAX) return false;
  l.push({ id: uid(), txt: texte, t: new Date().toISOString(), soignee: false });
  journal("marine", libBlessure(m, part) + " : " + texte);
  majEscouade(); return true;
}
function soignerBlessure(id, part, bid) {
  const m = marine(id), b = m && (m.blessures[part] || []).find(x => x.id === bid); if (!b) return;
  b.soignee = !b.soignee;
  journal("marine", libBlessure(m, part) + (b.soignee ? " soignée : " : " de nouveau active : ") + b.txt);
  majEscouade();
}
function supprimerBlessure(id, part, bid) {
  const m = marine(id), l = m && m.blessures[part], b = l && l.find(x => x.id === bid); if (!b) return;
  m.blessures[part] = l.filter(x => x !== b);
  if (!m.blessures[part].length) delete m.blessures[part];
  journal("marine", libBlessure(m, part) + " supprimée : " + b.txt);
  majEscouade();
}
function ajouterEquipement(id) {
  const m = marine(id); if (!m) return;
  const q = { id: uid(), lib: "", n: 0 };
  m.equip.push(q); sauver(); rendreEscouade();
  const c = mNoeuds.get(id).querySelector(`[data-f="eq-${q.id}"]`); if (c) c.focus();
}
function compterEquipement(id, qid, d) {
  const m = marine(id), q = m && m.equip.find(x => x.id === qid); if (!q) return;
  q.n = Math.min(99999, Math.max(0, q.n + d)); sauver(); rendreEscouade();
}
function supprimerEquipement(id, qid) {
  const m = marine(id); if (!m) return;
  m.equip = m.equip.filter(x => x.id !== qid); sauver(); rendreEscouade();
}
/* Frappe dans un champ d'identité : S mis à jour, résumé de la fiche rafraîchi sans re-rendu */
function saisirChampMarine(t) {
  const m = marine(t.dataset.mid), k = t.dataset.mchamp; if (!m || !(k in m)) return;
  m[k] = t.value.slice(0, Number(t.maxLength) > 0 ? t.maxLength : 60);
  sauver();
  const n = mNoeuds.get(m.id); if (!n) return;
  const [nom, ps] = nomsResume(m), e = n.querySelector(".m-ps");
  n.querySelector(".m-nom").textContent = nom;
  e.textContent = ps; e.hidden = !ps;
}
/* Résumé de la fiche repliée : [libellé principal, pseudo entre guillemets ou ""].
   Nom + pseudo si les deux existent, sinon le seul renseigné, sinon immatriculation ou « Marine sans nom ». */
function nomsResume(m) {
  const nom = m.nom.trim(), ps = m.pseudo.trim();
  if (nom && ps) return [nom, "« " + ps + " »"];
  return [nom || ps || m.matricule.trim() || "Marine sans nom", ""];
}
/* Fait défiler pour que l'en-tête de la fiche soit visible sous le bandeau fixe (seulement s'il ne l'est pas). */
function montrerFiche(n) {
  const haut = $("#bandeau").offsetHeight + 6, y = n.getBoundingClientRect().top;
  if (y < haut || y > innerHeight - 80) window.scrollBy({ top: y - haut });
}
function saisirEquipement(t, fin) {
  const m = marine(t.dataset.mid), q = m && m.equip.find(x => x.id === t.dataset.eq); if (!q) return;
  if (t.dataset.eqchamp === "lib") q.lib = t.value.slice(0, 80);
  else {
    const n = Math.floor(Number(t.value));
    if (t.value !== "" && Number.isFinite(n)) q.n = Math.min(99999, Math.max(0, n));
    if (fin) t.value = q.n;  // à la sortie du champ : affiche la valeur retenue
  }
  sauver();
}
function actionMarine(b) {
  const d = b.dataset, id = d.mid;
  if (d.msante) return changerSante(id, d.msante);
  if (d.mstress) return changerStress(id, Number(d.mstress));
  if (d.mbless) return ouvrirBlessures(id, d.mbless);
  if (d.eqd) return compterEquipement(id, d.eq, Number(d.eqd));
  if (d.eqsup) return supprimerEquipement(id, d.eq);
  if (d.eqajout) return ajouterEquipement(id);
  if (d.msup) return supprimerMarine(id);
}

/* ---------- Utilitaires d'affichage ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function annonce(n) {
  const x = (S.reglages.escouade || "").trim() || "X";
  return DOREX_DATA.annonce.texte.replace("{X}", x).replace("{Y}", n);
}
function couleurNiv(n) { return n >= 4 ? "var(--red)" : n === 3 ? "var(--orange)" : n === 2 ? "var(--amber)" : "var(--fg)"; }
function badgeNiv(n, rel) { return `<span class="badge b-n${n}">${rel ? "+1 → " : ""}N${n}</span>`; }
function modeBadge(m) {
  if (m === "auto") return `<span class="badge b-n4">AUTO</span>`;
  if (m === "validation") return `<span class="badge b-val">VALIDATION CDT</span>`;
  return "";
}
function heure(iso) {
  const d = new Date(iso), auj = new Date();
  const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  return d.toDateString() === auj.toDateString() ? h : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " " + h;
}
function statutsActifs() {
  const s = new Map();
  for (const id of Object.keys(S.events)) { const e = EV[id]; if (e.statut && !s.has(e.statut)) s.set(e.statut, e.src); }
  return [...s];
}

/* ---------- Rendu ---------- */
function rendre() {
  document.body.dataset.niv = S.niveau;
  document.body.classList.toggle("ambre", S.reglages.theme === "ambre");
  document.body.classList.toggle("scan", !!S.reglages.scan);
  const L = NIV[S.niveau];
  $("#bNum").textContent = S.niveau;
  $("#bNom").textContent = L.nom;
  $("#bSub").innerHTML = `ROE <b>${L.roe.n} ${esc(L.roe.nom)}</b> · Zone <b>${esc(L.zone.split(" — ")[0])}</b>`;
  const r = requis();
  const av = $("#avert");
  if (r.niveau > S.niveau) {
    av.className = "on";
    av.innerHTML = `⚠ NIVEAU REQUIS (${r.niveau}) SUPÉRIEUR AU NIVEAU ACTIF (${S.niveau}) — toucher pour revoir`;
  } else { av.className = ""; av.textContent = ""; }
  const nb = Object.keys(S.events).length;
  const p = $("#nbEv"); p.hidden = !nb; p.textContent = nb;
  rendreNiveau(r); rendreEvents(r); rendreZones(r); rendreEscouade(); rendreJournal(); rendrePlus();
}

function rendreNiveau(r) {
  const L = NIV[S.niveau];
  const coches = S.mesures[S.niveau] || [];
  const nbFait = L.mesures.items.filter((_, i) => coches[i]).length;
  const statuts = statutsActifs();
  const herites = NIV.slice(0, S.niveau).filter(n => n.interdits);
  let h = `
  <div class="carte alert">
    <div class="directive">${esc(L.directive)}</div>
    <div class="src">Directive de commandement — ${L.srcDir}</div>
  </div>`;
  if (statuts.length) h += `<div class="carte"><b>Statuts actifs :</b> ${statuts.map(([s, src]) => `<span class="badge b-statut">${esc(s)}</span> <span class="src">${esc(src)}</span>`).join(" ")}</div>`;
  if (r.niveau > S.niveau) h += `<div class="carte" style="border-color:var(--red)"><b class="b-val">Niveau requis : ${r.niveau}</b> — ${r.sources.filter(s => s.niveau > S.niveau).map(s => esc(s.lib)).join(" ; ")}.
    <div class="btns"><button class="btn pri" data-act="revoir">Revoir le passage en N${r.niveau}</button></div></div>`;
  h += `<h2>Mesures immédiates <span class="src">${L.mesures.src}</span> — ${nbFait}/${L.mesures.items.length}</h2><div class="carte" style="padding:0 6px">`;
  L.mesures.items.forEach((m, i) => {
    const txt = m.includes("{ANNONCE}") ? m.replace("{ANNONCE}", annonce(S.niveau)) : m;
    h += `<label class="chk ${coches[i] ? "fait" : ""}"><input type="checkbox" data-mesure="${i}" ${coches[i] ? "checked" : ""}><span class="box"></span><span class="corps"><span class="lib">${i + 1}. ${esc(txt)}</span></span></label>`;
  });
  h += `</div>`;
  if (L.notes && L.notes.length) h += `<ul class="plain">${L.notes.map(([t, s]) => `<li>${esc(t)} <span class="src">${esc(s)}</span></li>`).join("")}</ul>`;
  h += `<div class="deux-col"><div><h2>Interdits <span class="src">${L.interdits.src}</span></h2><ul class="plain interdits">${L.interdits.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  if (herites.length) h += `<details><summary>Interdits hérités (N0–N${S.niveau - 1})</summary><div class="in"><p class="src">Chaque niveau hérite des interdits des niveaux inférieurs (✔ règle de table).</p>${herites.map(n => `<h3>N${n.n} <span class="src">${n.interdits.src}</span></h3><ul class="plain interdits">${n.interdits.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`).join("")}</div></details>`;
  h += `</div><div>`;
  if (L.escalade) h += `<h2>Escalade → niveau ${L.escalade.vers}</h2><ul class="plain">${L.escalade.items.map(([t, s]) => `<li>${esc(t)} <span class="src">${esc(s)}</span></li>`).join("")}</ul>`;
  else h += `<h2>Escalade</h2><p>Niveau maximal.</p>`;
  h += `</div></div>
  <h2>Situation, engagement, zone</h2>
  <p>${esc(L.situation)} <span class="src">${L.srcSit}</span></p>
  <div class="carte">
    <div class="ligne"><b>ROE ${L.roe.n} — ${esc(L.roe.nom)}</b><span>Finalité : ${esc(L.roe.fin)}</span></div>
    <p style="font-size:14px">${esc(L.roe.detail)} <span class="src">${L.roe.src}</span></p>
    <div class="ligne"><b>Zone associée :</b><span>${esc(L.zone)}</span><span class="src">✔ règle de table</span></div>
  </div>
  <h2>Annonce radio</h2><div class="annonce">« ${esc(annonce(S.niveau))} »</div><div class="src">${DOREX_DATA.annonce.src}</div>
  <div class="btns">
    <button class="btn pri" data-act="monter" ${S.niveau >= 5 ? "disabled" : ""}>▲ Monter le niveau</button>
    <button class="btn dang" data-act="baisser" ${S.niveau <= 0 ? "disabled" : ""}>▼ Baisser le niveau</button>
    <button class="btn" data-act="raz-mesures">Décocher les mesures N${S.niveau}</button>
  </div>`;
  $("#t-niveau").innerHTML = h;
}

function rendreEvents(r) {
  let h = `<div class="resume">
    <div><div class="src">NIVEAU REQUIS</div><div class="big b-n${r.niveau}">${r.niveau}</div></div>
    <div><div class="src">NIVEAU ACTIF</div><div class="big b-n${S.niveau}">${S.niveau}</div></div></div>
    <p class="src">Niveau requis = maximum des événements cochés et des zones. « +1 » = niveau au moment où l'événement est coché, plus un. Décocher fait redescendre automatiquement au niveau imposé par ce qui reste actif.</p>
    <div class="btns"><button class="btn" data-act="ouvrir-tout">Tout déplier</button><button class="btn" data-act="fermer-tout">Tout replier</button></div>`;
  for (const g of DOREX_DATA.groupes) {
    const evs = DOREX_DATA.evenements.filter(e => e.g === g.id);

const ECG_TRACES = {};

      + ` L${f(x)} ${f(B - 16 * a)} L${f(x + 2.5)} ${f(B + 5 * a)} L${f(x + 5)} ${B} Q${f(x + 11)} ${f(B - 5 * a)} ${f(x + 17)} ${B}`;

/* Recale la phase des cardiogrammes d'une fiche neuve sur l'horloge de la page : une fiche reconstruite
   reprend le tracé là où l'ancienne en était (pas de saut visible). */
function calerECG(n) {
  n.querySelectorAll(".ecg-rail").forEach(r => {
    const d = Number(r.dataset.duree);
    if (d > 0) r.style.animationDelay = -((performance.now() / 1000) % d).toFixed(3) + "s";
  });
}
function remplacerNoeud(ancien, nouveau) {
  const act = document.activeElement;
  let cle = null, sel = null;
  if (act && ancien.contains(act) && act.dataset && act.dataset.f) {
    cle = act.dataset.f;
    try { if (typeof act.selectionStart === "number") sel = [act.selectionStart, act.selectionEnd]; } catch (e) {}
  }
  ancien.replaceWith(nouveau);
  if (!cle) return;
  const x = [...nouveau.querySelectorAll("[data-f]")].find(el => el.dataset.f === cle);
  if (x) { x.focus({ preventScroll: true }); if (sel && x.setSelectionRange) try { x.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
}

/* hn : niveau de titre ; cls : classe du bloc (« rg-b » = filtrable par la recherche) */
function rgBloc(b, hn, cls) {
  hn = hn || "h3"; cls = cls || "rg-b";
  if (b.gen) return RG_GEN[b.gen](b, hn, cls);
  let h = `<div class="${cls}">`;
  if (b.titre) h += `<${hn}>${esc(b.titre)}${rgSrc(b.src)}</${hn}>`;
  if (b.intro) h += `<p>${rgItem(b.intro)}</p>`;
  if (b.cartes) h += b.cartes.map(rgCarte).join("");
  if (b.items) h += rgListe(b.items, b);
  if (b.note) h += `<p class="rg-note">${rgItem(b.note)}</p>`;
  return h + `</div>`;
}
function annonceGenerique(y) { return DOREX_DATA.annonce.texte.replace("{X}", "X").replace("{Y}", y); }
function badgesEvent(e) {
  const niv = e.rel ? `<span class="badge b-rel">NIVEAU +1</span>` : (e.niveau !== null ? badgeNiv(e.niveau) : `<span class="badge b-statut">STATUT</span>`);
  return `${niv} ${modeBadge(e.mode)} ${e.statut ? `<span class="badge b-statut">${esc(e.statut)}</span>` : ""}`;
}

/* Générateurs : blocs construits à partir des données existantes (niveaux, événements, zones, ROE). */
const RG_GEN = {
  annonce: (b, hn, cls) => `<div class="${cls}"><${hn}>Annonce radio${rgSrc(DOREX_DATA.annonce.src)}</${hn}>
    <div class="annonce">« ${esc(annonceGenerique("Y"))} »</div>
    <p class="rg-note">Formule unique pour tout changement de niveau (montée ou saut). X = nom de l'escouade, Y = nouveau niveau.</p></div>`,

  recapNiveaux: (b, hn, cls) => `<div class="${cls}"><${hn}>Tableau récapitulatif</${hn}>
    <div class="tab-scroll"><table class="recap"><tr><th>Niveau</th><th>ROE</th><th>Zone</th></tr>
    ${NIV.map(n => `<tr data-rn="${n.n}"><td><b class="b-n${n.n}">${n.n}</b> ${esc(n.nom)}</td><td>${n.roe.n} ${esc(n.roe.nom)}<br><span class="src">${esc(n.roe.fin)}</span></td><td>${esc(n.zone.split(" — ")[0])}</td></tr>`).join("")}
    </table></div>
    <p class="rg-note">Ligne surlignée = niveau actif. EOD (niveaux), ROED (engagement), correspondance zones ✔ règle de table.</p></div>`,

  fichesNiveaux: () => NIV.map(L => {
    const F = DOREX_DATA.regles.fiches[L.n];
    let h = `<details class="sub"><summary><b class="b-n${L.n}">N${L.n}</b> ${esc(L.nom)}</summary><div class="in">
      <p class="rg-dir">${esc(L.directive)}${rgSrc(L.srcDir)}</p>
      <p><b>Situation :</b> ${esc(L.situation)}${rgSrc(L.srcSit)}</p>
      <p><b>Mission :</b> ${esc(F.mission)}${rgSrc(L.srcSit)}</p>
      <h4>Déclencheurs — un seul suffit${rgSrc(F.declencheurs.src)}</h4>${rgListe(F.declencheurs.items)}`;
    if (F.declencheurs.note) h += `<p class="rg-note">${rgItem(F.declencheurs.note)}</p>`;
    h += `<h4>Mesures immédiates${rgSrc(L.mesures.src)}</h4>${rgListe(L.mesures.items.map(m => m.replace("{ANNONCE}", annonceGenerique(L.n))), { ordre: true })}`;
    if (L.notes && !F.remplaceNotes) h += rgListe(L.notes);
    h += `<h4>Interdits${rgSrc(L.interdits.src)}</h4>${rgListe(L.interdits.items, { interdits: true })}`;
    if (L.n > 0) h += `<p class="rg-note">S'ajoutent les interdits des niveaux inférieurs (✔ règle de table).</p>`;
    h += F.complements.map(c => rgBloc(c, "h4", "rg-c")).join("");
    h += L.escalade ? `<h4>Escalade → niveau ${L.escalade.vers}${rgSrc(L.escalade.src)}</h4>${rgListe(L.escalade.items)}` : `<h4>Escalade</h4><p>Niveau maximal.</p>`;
    h += `<h4>Engagement — ROE ${L.roe.n} ${esc(L.roe.nom)}</h4><p><b>Finalité :</b> ${esc(L.roe.fin)}. ${esc(L.roe.detail)}${rgSrc(L.roe.src)}</p>
      <p><b>Zone associée :</b> ${esc(L.zone)}${rgSrc("✔ règle de table")}</p></div></details>`;
    return h;
  }).join(""),

  matrice: (b, hn, cls) => DOREX_DATA.groupes.map(g => {
    const evs = DOREX_DATA.evenements.filter(e => e.g === g.id);
    return `<div class="${cls}"><${hn}>${esc(g.titre)}</${hn}>${g.note ? `<p class="rg-note">${esc(g.note)}</p>` : ""}
      <ul class="plain mx">${evs.map(e => `<li>${esc(e.lib)}<div class="meta">${badgesEvent(e)}${rgSrc(e.src)}</div>${e.effet ? `<div class="eff">→ ${esc(e.effet)}</div>` : ""}</li>`).join("")}</ul></div>`;
  }).join("") + `<div class="${cls}"><${hn}>Zones</${hn}><ul class="plain mx">
      ${ZC.filter(z => z.niveauMin > 0).map(z => `<li>Zone classée C${z.c} (${esc(z.nom)})<div class="meta">${badgeNiv(z.niveauMin)}${rgSrc("✔ règle de table")}</div></li>`).join("")}
      <li>${DOREX_DATA.zonesC4Multiples.seuil} zones C4 ou plus (perte de contrôle de plusieurs zones critiques)<div class="meta">${badgeNiv(DOREX_DATA.zonesC4Multiples.niveauMin)}${rgSrc(DOREX_DATA.zonesC4Multiples.src)}</div></li></ul></div>`,

  minuteries: (b, hn, cls) => rgBloc(DOREX_DATA.regles.minuteries, hn, cls),

  roe: (b, hn, cls) => `<div class="${cls}"><${hn}>Échelle ROE 0 à 5</${hn}>${NIV.map(L => rgCarte({
      titre: "ROE " + L.roe.n + " — " + L.roe.nom, badge: ` <span class="badge b-n${L.n}">${esc(L.roe.fin)}</span>`,
      lignes: [["Niveau DOREX", "N" + L.n + " " + L.nom]], texte: L.roe.detail, src: L.roe.src })).join("")}</div>`,

  zonesC: (b, hn, cls) => `<div class="${cls}"><${hn}>Niveaux de zone${rgSrc("DOREX §7.3")}</${hn}>${ZC.map(z => rgCarte({
      titre: "C" + z.c + " — " + z.nom, badge: ` <span class="badge zc${z.c}" style="color:var(--zc)">C${z.c}</span>`,
      lignes: [["Condition", z.condition], ["Accès / mesures", z.mesures], ["Niveau DOREX minimal", z.niveauMin ? "N" + z.niveauMin : "—"]], src: z.src })).join("")}</div>`,

  zonesCorrespondance: (b, hn, cls) => `<div class="${cls}"><${hn}>Correspondance avec les niveaux DOREX${rgSrc("✔ règle de table")}</${hn}>
    <p><b>Zone concernée à chaque niveau :</b></p>${rgListe(NIV.map(L => "**N" + L.n + "** → " + L.zone))}
    <p><b>Niveau DOREX minimal imposé par une zone :</b></p>${rgListe(ZC.filter(z => z.niveauMin > 0).map(z => "**C" + z.c + "** → N" + z.niveauMin)
      .concat([[DOREX_DATA.zonesC4Multiples.seuil + " zones C4 ou plus → **N" + DOREX_DATA.zonesC4Multiples.niveauMin + "** (perte de contrôle de plusieurs zones critiques)", DOREX_DATA.zonesC4Multiples.src]]))}
    <p class="rg-note">Règle explicite des documents : disparition en zone EXO ou BIO → C2 minimum (DOREX §9.7, EOD §4.5).</p></div>`,

  crise: (b, hn, cls) => `<div class="${cls}"><${hn}>CRISE MAJEURE — un seul critère suffit${rgSrc("DOREX §11.1")}</${hn}>
    ${rgListe(DOREX_DATA.evenements.filter(e => e.g === "crise").map(e => e.lib))}
    <p class="rg-note">Un critère suffit : <b>niveau 4 automatique</b>, statut CRISE MAJEURE <span class="src">DOREX §11.1, §11.3</span>. Mesures des niveaux 4 et 5 : voir les fiches de niveau.</p></div>`
    + DOREX_DATA.regles.fiches[4].complements.concat(DOREX_DATA.regles.fiches[5].complements).map(c => rgBloc(c, hn, cls)).join("")
};

function rendreRegles() {
  let h = "";
  for (const s of DOREX_DATA.regles.sections) {
    h += `<details class="rg" data-rg="${s.id}"><summary>${esc(s.titre)}</summary><div class="in">`;
    if (s.blocs) h += s.blocs.map(b => rgBloc(b)).join("");
    if (s.sous) h += s.sous.map(ss => `<details class="sub"><summary>${esc(ss.titre)}${rgSrc(ss.src)}</summary><div class="in">${ss.blocs.map(b => rgBloc(b, "h4")).join("")}</div></details>`).join("");
    h += `</div></details>`;
  }
  REGLES_HTML = h;
  $("#t-regles").innerHTML = `<h2>Règles DOREX</h2>
    <div class="rg-q"><input type="text" id="rgQ" placeholder="Rechercher : drone, sas, symptôme…" autocomplete="off" enterkeyhint="search" aria-label="Rechercher dans les règles">
      <button class="btn ico" data-act="rg-effacer" aria-label="Effacer la recherche">✕</button></div>
    <p id="rgInfo" class="rg-note" aria-live="polite"></p>
    <div class="btns"><button class="btn" data-act="rg-ouvrir">Tout déplier</button><button class="btn" data-act="rg-fermer">Tout replier</button></div>
    <div id="rgCorps">${h}</div>`;
}

function sansAccent(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function chercherRegles(q) {
  const corps = $("#rgCorps"), info = $("#rgInfo");
  corps.innerHTML = REGLES_HTML;
  const nq = sansAccent(q.trim());
  if (nq.length < 2) { info.textContent = q.trim() ? "Saisir au moins 2 caractères." : ""; return; }
  // 1. Surlignage : texte normalisé caractère par caractère, avec correspondance des positions d'origine.
  const noeuds = [], w = document.createTreeWalker(corps, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) noeuds.push(w.currentNode);
  let total = 0;
  for (const tn of noeuds) {
    const t = tn.nodeValue;
    let n = ""; const pos = [];
    for (let i = 0; i < t.length; i++) for (const c of sansAccent(t[i])) { n += c; pos.push(i); }
    let i = n.indexOf(nq); if (i < 0) continue;
    const frag = document.createDocumentFragment(); let dernier = 0;
    while (i >= 0) {
      const deb = pos[i], fin = pos[i + nq.length - 1] + 1;
      if (deb >= dernier) {
        frag.appendChild(document.createTextNode(t.slice(dernier, deb)));
        const m = document.createElement("mark"); m.textContent = t.slice(deb, fin); frag.appendChild(m);
        dernier = fin; total++;
      }
      i = n.indexOf(nq, i + nq.length);
    }
    frag.appendChild(document.createTextNode(t.slice(dernier)));
    tn.parentNode.replaceChild(frag, tn);
  }
  // 2. Filtrage : sections et blocs sans correspondance masqués ; si le titre correspond, tout le contenu reste visible.
  const appliquer = d => {
    const contient = !!d.querySelector("mark");
    d.hidden = !contient; d.open = contient;
    if (!contient || d.querySelector(":scope > summary mark")) return;
    d.querySelectorAll(":scope > .in > .rg-b, :scope > .in > details.sub").forEach(x => {
      if (x.tagName === "DETAILS") return appliquer(x);
      x.hidden = !x.querySelector("mark");
      // Dans un bloc retenu dont le titre ne correspond pas : masquer aussi les cartes et lignes de matrice sans correspondance.
      const titre = x.querySelector(":scope > h3, :scope > h4");
      if (!x.hidden && !(titre && titre.querySelector("mark"))) x.querySelectorAll(".rc, ul.mx > li").forEach(c => c.hidden = !c.querySelector("mark"));
    });
  };
  const sections = [...corps.querySelectorAll("details.rg")];
  sections.forEach(appliquer);
  const nbS = sections.filter(d => !d.hidden).length;
  info.textContent = total ? total + " correspondance" + (total > 1 ? "s" : "") + " dans " + nbS + " section" + (nbS > 1 ? "s" : "") : "Aucun résultat.";
}

/* ---------- Modale ---------- */
const fileModale = [];
function modale(o) { fileModale.push(o); if (fileModale.length === 1) afficherModale(); }
function afficherModale() {
  const o = fileModale[0]; if (!o) { $("#modale").classList.remove("on"); $("#modaleCorps").innerHTML = ""; return; }
  const c = $("#modaleCorps");
  c.style.setProperty("--mc", o.couleur || "var(--alert)");
  c.innerHTML = `<h2>${esc(o.titre)}</h2>${o.html || ""}<div class="btns">${(o.boutons || []).map((b, i) => `<button class="btn ${b.cls || ""}" data-mb="${i}">${esc(b.lib)}</button>`).join("")}</div>`;
  c.querySelectorAll("[data-mb]").forEach(btn => btn.addEventListener("click", () => {
    const b = o.boutons[Number(btn.dataset.mb)];
    fermerModale();
    if (b.act) b.act();
  }));
  $("#modale").classList.add("on");
  if (o.apres) o.apres(c);
  // Focus sur le premier bouton, sauf si `apres` l'a déjà placé dans la modale (ex. champ de saisie)
  const premier = c.querySelector("button"); if (premier && !c.contains(document.activeElement)) premier.focus({ preventScroll: true });
}
function fermerModale() { fileModale.shift(); afficherModale(); }

/* ---------- Événements DOM ---------- */
function $(s) { return document.querySelector(s); }
function onglet(t) {
  document.querySelectorAll("#onglets button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "t-" + t));
  window.scrollTo(0, 0);
  try { sessionStorage.setItem("dorex-onglet", t); } catch (e) {}
}
document.getElementById("onglets").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) onglet(b.dataset.tab); });
document.getElementById("avert").addEventListener("click", () => proposerMontee(requis()));

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ev) basculerEvent(t.dataset.ev, t.checked);
  else if (t.dataset.mesure !== undefined) cocherMesure(S.niveau, Number(t.dataset.mesure), t.checked);
  else if (t.dataset.renom) renommerZone(t.dataset.renom, t.value);
  else if (t.id === "rEsc") { S.reglages.escouade = t.value.trim(); sauver(); rendre(); }
  else if (t.dataset.mstatut) changerStatut(t.dataset.mid, t.value);
  else if (t.dataset.eqchamp === "n") saisirEquipement(t, true);
});
document.addEventListener("keydown", e => {
  const d = e.target.dataset;
  if (e.key === "Enter" && d && (d.renom || d.mchamp || d.eqchamp)) e.target.blur();
  if (e.key === "Enter" && e.target.id === "rgQ") e.target.blur();
  // Parties du corps du schéma (éléments SVG focalisables) : Entrée / Espace = clic
  if ((e.key === "Enter" || e.key === " ") && d && d.part && !fileModale.length) { e.preventDefault(); ouvrirBlessures(d.mid, d.part); }
  if (e.key === "Escape" && fileModale.length) fermerModale();
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset) return;
  if (d.dataset.grp) (S._ouverts || (S._ouverts = {}))[d.dataset.grp] = d.open;
  else if (d.dataset.marine) {
    const id = d.dataset.marine;
    if (!d.open) { mOuverts.delete(id); return; }
    // Fiche déjà mémorisée ouverte = simple reconstruction du nœud : ni repli des autres ni défilement
    if (mOuverts.has(id)) return;
    // Accordéon : ouvrir une fiche replie les autres, puis ramène son en-tête à l'écran
    mOuverts.clear(); mOuverts.add(id);
    for (const [mid, x] of mNoeuds) if (mid !== id && x.open) x.open = false;
    requestAnimationFrame(() => montrerFiche(d));
  }
}, true);
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.mchamp) return saisirChampMarine(t);
  if (t.dataset.eqchamp) return saisirEquipement(t, false);
  if (t.id !== "rgQ") return;
  clearTimeout(rechercheMinuterie);
  rechercheMinuterie = setTimeout(() => chercherRegles(t.value), 150);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "fZone") ajouterZone($("#zNom").value, nouvelleC);
  else if (e.target.id === "fNote") {
    const v = $("#nTxt").value.trim(); if (!v) return;
    journal("note", v, $("#nCat").value); sauver(); rendreJournal();
  }
});
document.addEventListener("click", e => {
  const p = e.target.closest("[data-part]");
  if (p && !p.closest("#modale")) return ouvrirBlessures(p.dataset.mid, p.dataset.part);
  const b = e.target.closest("button"); if (!b || b.closest("#modale") || b.closest("#onglets")) return;
  if (b.dataset.mid) return actionMarine(b);
  if (b.dataset.jf) { filtreJournal = b.dataset.jf; return rendreJournal(); }
  if (b.dataset.newc !== undefined) {
    nouvelleC = Number(b.dataset.newc);
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    return;
  }
  if (b.dataset.zone) return classerZone(b.dataset.zone, Number(b.dataset.c));
  if (b.dataset.supz) return supprimerZone(b.dataset.supz);
  switch (b.dataset.act) {
    case "monter": return changerNiveauManuel(1);
    case "baisser": return changerNiveauManuel(-1);
    case "revoir": return proposerMontee(requis());
    case "raz-mesures": S.mesures[S.niveau] = []; journal("mesure", "Mesures N" + S.niveau + " décochées"); sauver(); return rendre();
    case "ouvrir-tout": case "fermer-tout": {
      const o = b.dataset.act === "ouvrir-tout"; S._ouverts = {};
      DOREX_DATA.groupes.forEach(g => S._ouverts[g.id] = o); return rendreEvents(requis());
    }
    case "rg-ouvrir": case "rg-fermer": {
      const o = b.dataset.act === "rg-ouvrir";
      document.querySelectorAll("#rgCorps details").forEach(d => { if (!d.hidden) d.open = o; }); return;
    }
    case "rg-effacer": $("#rgQ").value = ""; return chercherRegles("");
    case "m-ajouter": return ajouterMarine();
    case "theme": S.reglages.theme = S.reglages.theme === "ambre" ? "vert" : "ambre"; sauver(); return rendre();
    case "scan": S.reglages.scan = !S.reglages.scan; sauver(); return rendre();
    case "export": return exporter();
    case "import": return $("#fichierImport").click();
    case "nouvelle": return modale({ titre: "Nouvelle partie ?", couleur: "var(--red)",
      html: "<p>Tout l'état (niveau, événements, zones, mesures, escouade, journal) sera effacé. Pensez à exporter d'abord. Les réglages sont conservés.</p>",
      boutons: [{ lib: "Effacer et recommencer", cls: "dang", act: () => { S = etatVide(S.reglages); journal("systeme", "Nouvelle partie"); sauver(); rendre(); } }, { lib: "Annuler" }] });
  }
});

/* Téléphone : l'export passe par le menu de partage du système (Drive, mail…) plutôt que par un
   téléchargement difficile à retrouver. Chrome refuse de partager un .json : le fichier partagé est en .txt,
   l'import accepte les deux (seul le contenu est vérifié). */
function surMobile() {
  return navigator.userAgentData ? navigator.userAgentData.mobile : /Android|iPhone|iPad/i.test(navigator.userAgent);
}
async function exporter() {
  const copie = Object.assign({}, S); delete copie._ouverts;
  const d = new Date(), p = x => String(x).padStart(2, "0");
  const base = `dorex-partie-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  const texte = JSON.stringify(copie, null, 2);
  let nom = base + ".txt";
  const fichier = new File([texte], nom, { type: "text/plain" });
  let partage = false;
  if (surMobile() && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try { await navigator.share({ files: [fichier], title: "Sauvegarde DOREX" }); partage = true; }
    catch (e) { if (e.name === "AbortError") return; /* autre échec : téléchargement classique */ }
  }
  if (!partage) {
    nom = base + ".json";
    const url = URL.createObjectURL(new Blob([texte], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  journal("systeme", (partage ? "Partage : " : "Export : ") + nom); sauver(); rendreJournal();
}
$("#fichierImport").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const lr = new FileReader();
  lr.onload = () => {
    try {
      const o = JSON.parse(lr.result);
      if (!o || typeof o !== "object" || !("niveau" in o)) throw new Error("format");
      modale({ titre: "Importer « " + f.name + " » ?", html: "<p>L'état actuel sera remplacé.</p>", boutons: [
        { lib: "Importer", cls: "pri", act: () => { S = normaliser(o); journal("systeme", "Import : " + f.name); sauver(); rendre(); } }, { lib: "Annuler" }] });
    } catch (err) {
      modale({ titre: "Import impossible", couleur: "var(--red)", html: "<p>Le fichier n'est pas une sauvegarde DOREX valide.</p>", boutons: [{ lib: "OK" }] });
    }
    e.target.value = "";
  };
  lr.readAsText(f);
});

/* ---------- PWA (uniquement servi en http/https) ---------- */
if (/^https?:$/.test(location.protocol)) {
  const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
  const a = document.createElement("link"); a.rel = "apple-touch-icon"; a.href = "icon-192.png"; document.head.appendChild(a);
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ---------- Démarrage ---------- */
charger();
if (!S.journal.length) { journal("systeme", "Terminal DOREX initialisé"); sauver(); }
rendre();
rendreRegles();
try { const t = sessionStorage.getItem("dorex-onglet"); if (t) onglet(t); } catch (e) {}
/* Accès de débogage (console) */
window.DOREX = { get etat() { return S; }, requis, analysePassage, basculerEvent, classerZone, ajouterZone, setNiveau, ajouterMarine, normaliser, DOREX_DATA };
</script>
</body>
